#!/bin/bash
# Backup Manager Configuration File
# Adapter les chemins selon votre environnement

# === SOURCES À SAUVEGARDER ===
# Spécifier les répertoires à sauvegarder (séparés par des espaces)
SOURCE_DIRS="/etc /var/www /home"

# === DESTINATION DES BACKUPS ===
# Chemin où stocker les archives de sauvegarde
BACKUP_DEST="/mnt/backups"

# === RÉTENTION DES BACKUPS ===
# Nombre de jours avant suppression automatique des anciens backups
RETENTION_DAYS=30

# === COMPRESSION ===
# Type de compression : gzip (fast), bzip2 (medium), xz (best)
COMPRESSION="gzip"

# === EXCLUSIONS ===
# Fichiers/répertoires à exclure de la sauvegarde
EXCLUDE_PATTERNS=(
  "*.log"
  "*.tmp"
  ".cache/*"
  "__pycache__/*"
  ".git/*"
  "node_modules/*"
  ".venv/*"
  "dist/*"
  "build/*"
)

# === LOGGING ===
# Chemin du fichier log
LOG_FILE="/var/log/backup-manager.log"
LOG_LEVEL="INFO"  # DEBUG, INFO, WARNING, ERROR

# === NOTIFICATIONS ===
# Activer les notifications en cas d'erreur
ENABLE_ALERTS="false"
ALERT_EMAIL="admin@example.com"
ALERT_ON_FAILURE="true"
ALERT_ON_SUCCESS="false"

# === CHIFFREMENT (optionnel) ===
# Activer le chiffrement GPG des backups
ENCRYPT_BACKUPS="false"
ENCRYPTION_KEY_ID=""  # Laisser vide pour utiliser la clé par défaut

# === VÉRIFICATION D'INTÉGRITÉ ===
# Générer et stocker les checksums MD5
GENERATE_CHECKSUMS="true"

# === BACKUP INCRÉMENTAL ===
# Utiliser --newer-mtime-than pour les backups incrémentaux
ENABLE_INCREMENTAL="true"

# === VERBOSITÉ ===
# Afficher les détails lors de l'exécution
VERBOSE="false"

# === COMPRESSION LEVEL ===
# Niveau de compression (1-9) : 1=rapide, 9=meilleure compression
COMPRESSION_LEVEL=6

# === STATISTIQUES ===
# Collecter et enregistrer les statistiques de backup
COLLECT_STATS="true"
STATS_FILE="/var/log/backup-manager-stats.csv"
