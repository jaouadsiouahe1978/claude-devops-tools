version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-demo
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecurepassword123
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pg_stat_statements"
    ports:
      - "5432:5432"
    volumes:
      # Persistance des données
      - postgres-data:/var/lib/postgresql/data
      # Configuration personnalisée
      - ./configmap.yaml:/etc/postgresql/postgresql.conf
      # Script d'initialisation
      - ./configmap.yaml:/docker-entrypoint-initdb.d/01-init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres-network
    restart: unless-stopped
    # Pour limiter les ressources (équivalent aux limits k8s)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres-data:
    driver: local

networks:
  postgres-network:
    driver: bridge
