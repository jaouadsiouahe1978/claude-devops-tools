# Ansible Inventory - Multi-Serveurs

[webservers]
# Simulé pour développement. En production, utiliser des IPs réelles
web1 ansible_host=192.168.1.10 ansible_port=22 environment=prod
web2 ansible_host=192.168.1.11 ansible_port=22 environment=prod

[dbservers]
db1 ansible_host=192.168.1.20 ansible_port=22 environment=prod

[monitoring]
monitor1 ansible_host=192.168.1.30 ansible_port=22 environment=prod

# Variables globales
[all:vars]
# Connexion SSH
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
# ou utiliser le password :
# ansible_password={{ vault_ssh_password }}

# Timeouts et comportements
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
ansible_become=yes
ansible_become_method=sudo

# Proxy (si nécessaire)
# http_proxy=http://proxy.example.com:8080
# https_proxy=https://proxy.example.com:8080

# Répertoires de travail
app_root=/opt/app
app_user=appuser
app_group=appgroup
