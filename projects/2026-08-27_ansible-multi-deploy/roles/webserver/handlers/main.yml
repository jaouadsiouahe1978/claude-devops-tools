---
# Handlers pour le rôle webserver

- name: "Restart Nginx"
  systemd:
    name: nginx
    state: restarted

- name: "Reload Nginx"
  systemd:
    name: nginx
    state: reloaded

- name: "Restart Node App"
  systemd:
    name: "{{ app_name | default('app') }}.service"
    state: restarted

- name: "Reload systemd"
  systemd:
    daemon_reload: yes
