replicaCount: 1
image:
  repository: myapp
  pullPolicy: IfNotPresent
  tag: "1.0.0"
service:
  type: ClusterIP
  port: 5000
  targetPort: 5000
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
environment: development
appVersion: "1.0.0"
config:
  logLevel: INFO
healthCheck:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 30
