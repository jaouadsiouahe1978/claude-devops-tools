---
- name: Install Nginx
  package:
    name: nginx
    state: present
  notify: Restart Nginx

- name: Allow Nginx backend port through firewall
  ufw:
    rule: allow
    port: "{{ nginx_listen_port }}"
    proto: tcp
  ignore_errors: yes

- name: Create Nginx configuration from template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: Reload Nginx

- name: Create Nginx sites-available directory
  file:
    path: /etc/nginx/sites-available
    state: directory
    mode: '0755'

- name: Create Nginx sites-enabled directory
  file:
    path: /etc/nginx/sites-enabled
    state: directory
    mode: '0755'

- name: Create Nginx conf.d directory
  file:
    path: /etc/nginx/conf.d
    state: directory
    mode: '0755'

- name: Validate Nginx configuration
  command: /usr/sbin/nginx -t
  changed_when: false
  register: nginx_config_check

- name: Show configuration validation result
  debug:
    msg: "Nginx configuration is valid"
  when: nginx_config_check.rc == 0

- name: Enable Nginx service
  systemd:
    name: nginx
    enabled: yes
    state: started

- name: Create Nginx log directory
  file:
    path: /var/log/nginx
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    mode: '0755'

- name: Test health endpoint
  uri:
    url: "http://localhost:{{ nginx_listen_port }}/health"
    method: GET
  register: health_check
  retries: 3
  delay: 2
  until: health_check.status == 200

- name: Display Nginx service status
  debug:
    msg: "Nginx is running on port {{ nginx_listen_port }} and responding to health checks"
