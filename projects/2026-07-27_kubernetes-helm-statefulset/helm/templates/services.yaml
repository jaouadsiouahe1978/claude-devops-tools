{{- if .Values.app.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
spec:
  type: {{ .Values.service.app.type }}
  ports:
  - port: {{ .Values.service.app.port }}
    targetPort: {{ .Values.service.app.targetPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ .Values.app.name }}
{{- end }}

{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
spec:
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - port: {{ .Values.service.postgres.port }}
    targetPort: {{ .Values.service.postgres.targetPort }}
    protocol: TCP
    name: postgres
  selector:
    app: postgres
{{- end }}

{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: {{ .Values.namespace }}
  labels:
    app: redis
spec:
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - port: {{ .Values.service.redis.port }}
    targetPort: {{ .Values.service.redis.targetPort }}
    protocol: TCP
    name: redis
  selector:
    app: redis
{{- end }}
