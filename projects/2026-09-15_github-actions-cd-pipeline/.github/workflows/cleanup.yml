name: Cleanup Old Artifacts

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  cleanup-packages:
    name: Delete Old Container Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete untagged images
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'app'
          package-type: 'container'
          delete-only-untagged-versions: true
          num-old-versions-to-delete: 0

      - name: Cleanup old images
        run: |
          echo "🧹 Scheduled cleanup of old container images"
          echo "Date: $(date)"
          echo "Repository: ${{ github.repository }}"
          # Additional cleanup scripts can be added here

  cleanup-artifacts:
    name: Delete Old Build Artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow runs
        uses: actions/delete-workflow-runs@v4
        with:
          retain-days: 7
          keep-minimum-runs: 3

  notify-cleanup:
    name: Notify Cleanup Complete
    runs-on: ubuntu-latest
    needs: [cleanup-packages, cleanup-artifacts]
    if: always()
    steps:
      - name: Log cleanup summary
        run: |
          echo "✅ Cleanup workflow completed"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
