name: Matrix Build - Multi-Platform

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'

jobs:
  build-matrix:
    name: Build for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
        node-version:
          - '16'
          - '18'
          - '20'
        exclude:
          # Reduce matrix size to avoid too many builds
          - node-version: '16'
            platform: linux/arm/v7

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Generate build tag
        id: meta
        run: |
          TAG="node-${{ matrix.node-version }}-${{ github.ref_name }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY_USER }}/myapp:${{ steps.meta.outputs.tag }}
          build-args: |
            NODE_VERSION=${{ matrix.node-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create build report
        run: |
          cat > build-report-${{ matrix.node-version }}.json << EOF
          {
            "platform": "${{ matrix.platform }}",
            "node_version": "${{ matrix.node-version }}",
            "image": "${{ secrets.DOCKER_REGISTRY_USER }}/myapp:${{ steps.meta.outputs.tag }}",
            "build_time": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "success": true
          }
          EOF

      - name: Upload build report
        uses: actions/upload-artifact@v3
        with:
          name: build-reports
          path: build-report-*.json

  summarize:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-matrix
    if: always()

    steps:
      - name: Download build reports
        uses: actions/download-artifact@v3
        with:
          name: build-reports

      - name: Generate summary
        run: |
          echo "# 📊 Build Matrix Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built for the following combinations:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Node Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|--------|" >> $GITHUB_STEP_SUMMARY

          for report in build-report-*.json; do
            NODE=$(grep node_version $report | cut -d'"' -f4)
            PLATFORM=$(grep platform $report | grep -o 'linux/[^"]*' | head -1)
            echo "| $PLATFORM | $NODE | ✅ |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Notify build completion
        uses: slackapi/slack-github-action@v1.24.0
        if: success()
        with:
          payload: |
            {
              "text": "✅ Multi-Platform Build Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Multi-Platform Build Complete*\nBuilt for Linux AMD64, ARM64, and ARMv7\nNode versions: 16, 18, 20"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
