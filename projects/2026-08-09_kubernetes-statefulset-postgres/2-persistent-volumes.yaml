---
# ============================================================================
# IMPORTANT: Pour minikube/kind, les répertoires doivent exister sur le host
# ============================================================================
# minikube ssh
# sudo mkdir -p /data/pv-0 /data/pv-1
# sudo chmod 777 /data/pv-0 /data/pv-1
# ============================================================================

---
# PersistentVolume 0 - 10Gi pour postgres-0
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-0
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain

  # Mode local - stockage sur le node
  local:
    path: /data/pv-0

  # Le volume doit être sur un node spécifique
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube  # Remplacer par le nom du node réel

---
# PersistentVolume 1 - 10Gi pour postgres-1
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-1
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain

  # Mode local - stockage sur le node
  local:
    path: /data/pv-1

  # Le volume doit être sur un node spécifique
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube  # Remplacer par le nom du node réel

---
# Optionnel: StorageClass pour local volumes
# Utile pour une meilleure gestion des PersistentVolumes locaux
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
# Note: Ce StorageClass ne provisionne pas automatiquement les PV
# Il faut les créer manuellement (comme ci-dessus)
