version: '3.8'

services:
  registry:
    image: registry:2.8
    container_name: local-docker-registry
    ports:
      - "5000:5000"
    volumes:
      - registry-storage:/var/lib/registry
      - ./registry-config.yml:/etc/docker/registry/config.yml:ro
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    networks:
      - secure-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-app-instance
    ports:
      - "3000:3000"
    networks:
      - secure-net
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

volumes:
  registry-storage:
    driver: local

networks:
  secure-net:
    driver: bridge
