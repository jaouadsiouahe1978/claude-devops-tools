{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multitier.frontend.fullname" . }}
  labels:
    {{- include "multitier.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "multitier.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}

{{- if .Values.backend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multitier.backend.fullname" . }}
  labels:
    {{- include "multitier.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "multitier.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}

{{- if .Values.database.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multitier.database.fullname" . }}
  labels:
    {{- include "multitier.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.database.service.type }}
  ports:
    - port: {{ .Values.database.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "multitier.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
{{- end }}
