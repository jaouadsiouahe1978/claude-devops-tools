{{- if .Values.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "multitier.serviceAccountName" . }}
  labels:
    {{- include "multitier.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "multitier.fullname" . }}
  labels:
    {{- include "multitier.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "multitier.fullname" . }}
  labels:
    {{- include "multitier.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "multitier.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "multitier.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
{{- end }}
