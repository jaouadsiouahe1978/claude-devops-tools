# Default values for multitier Helm chart

# Global settings
global:
  environment: development

# Frontend Configuration
frontend:
  enabled: true
  name: frontend
  replicaCount: 2

  image:
    repository: nginx
    pullPolicy: IfNotPresent
    tag: "1.24"

  service:
    type: LoadBalancer
    port: 80
    targetPort: 80

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# Backend Configuration
backend:
  enabled: true
  name: backend
  replicaCount: 2

  image:
    repository: node
    pullPolicy: IfNotPresent
    tag: "18-alpine"

  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  env:
    - name: NODE_ENV
      value: "development"
    - name: DB_HOST
      value: "postgresql"
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "myapp"

# Database Configuration
database:
  enabled: true
  name: postgresql
  replicaCount: 1

  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: "15-alpine"

  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  # Database credentials (should use Secrets in production)
  auth:
    username: postgres
    password: postgres
    database: myapp

  # Persistence
  persistence:
    enabled: true
    storageClass: standard
    size: 5Gi
    mountPath: /var/lib/postgresql/data
    subPath: postgres

# ConfigMap for application config
configMap:
  enabled: true
  data:
    app_name: "Multi-Tier Application"
    log_level: "info"
    api_timeout: "30s"

# Secrets (Base64 encoded in production)
secrets:
  enabled: true
  # These should be generated and stored securely
  apiKey: "your-api-key-here"
  jwtSecret: "your-jwt-secret-here"

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

  hosts:
    - host: "myapp.example.com"
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: myapp-tls
      hosts:
        - myapp.example.com

# Network Policies
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress

# RBAC
rbac:
  create: true

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Namespace
namespace: default
