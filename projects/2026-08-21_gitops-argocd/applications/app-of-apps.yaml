# ArgoCD App of Apps Pattern
# This demonstrates deploying multiple applications through a single parent application
# Useful for managing complex, multi-application systems

---
# Parent Application that manages other applications
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: app-of-apps
    app.kubernetes.io/instance: root
spec:
  project: default

  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true

  revisionHistoryLimit: 5

---
# Development Environment Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-apps
  namespace: argocd
  labels:
    env: dev
    tier: backend
spec:
  project: default

  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: main
    path: guestbook
    helm:
      values: |
        environment: development
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Validate=true

  revisionHistoryLimit: 5

---
# Staging Environment Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-apps
  namespace: argocd
  labels:
    env: staging
    tier: backend
spec:
  project: default

  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: main
    path: guestbook
    helm:
      values: |
        environment: staging
        replicas: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Validate=true

  revisionHistoryLimit: 5

---
# Production Environment Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-apps
  namespace: argocd
  labels:
    env: production
    tier: backend
spec:
  project: default

  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: main
    path: guestbook
    helm:
      values: |
        environment: production
        replicas: 3
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - guestbook
              topologyKey: kubernetes.io/hostname

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # Manual sync for production (safer)
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - Validate=true

  revisionHistoryLimit: 10

---
# Monitoring Stack Application (Prometheus + Grafana)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  labels:
    tier: monitoring
    component: observability
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: "15.0.0"
    chart: kube-prometheus-stack
    helm:
      values: |
        prometheus:
          prometheusSpec:
            retention: 30d
            resources:
              requests:
                cpu: 250m
                memory: 512Mi

        grafana:
          enabled: true
          adminPassword: "changeme123"
          replicas: 2

        alertmanager:
          enabled: true
          alertmanagerSpec:
            replicas: 2

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Validate=true

  revisionHistoryLimit: 5

---
# Ingress Controller Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-controller
  namespace: argocd
  labels:
    tier: networking
    component: ingress
spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: "4.8.0"
    chart: ingress-nginx
    helm:
      values: |
        controller:
          replicas: 2
          service:
            type: LoadBalancer
          resources:
            requests:
              cpu: 100m
              memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: false  # Don't prune ingress controller
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Validate=true

  revisionHistoryLimit: 5

---
# ArgoCD Self-Managed Application (ArgoCD managing itself)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self-managed
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/instance: self-managed
spec:
  project: default

  source:
    repoURL: https://github.com/argoproj/argo-cd.git
    targetRevision: master
    path: manifests/install
    kustomize:
      patches:
      - target:
          kind: ConfigMap
          name: argocd-cmd-params-cm
        patch: |-
          - op: add
            path: /data/server.grpc.web
            value: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - Validate=true

  revisionHistoryLimit: 10

---
# AppProject for Staging and Production
# Defines RBAC and access controls for applications
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: production-project
  namespace: argocd
spec:
  description: Production applications project with strict controls

  # Source repositories allowed
  sourceRepos:
  - 'https://github.com/argoproj/*'
  - 'https://github.com/your-org/*'

  # Destinations allowed (clusters and namespaces)
  destinations:
  - namespace: 'production'
    server: https://kubernetes.default.svc
  - namespace: 'monitoring'
    server: https://kubernetes.default.svc
  - namespace: 'ingress-nginx'
    server: https://kubernetes.default.svc

  # Cluster resources that can be managed
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRole
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRoleBinding

  # Deny specific resources
  clusterResourceBlacklist:
  - group: ''
    kind: ResourceQuota
  - group: ''
    kind: LimitRange

  # Namespace resources that can be managed
  namespaceResourceBlacklist:
  - group: ''
    kind: ResourceQuota
  - group: ''
    kind: LimitRange
  - group: ''
    kind: NetworkPolicy

---
# AppProject for Development
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: development-project
  namespace: argocd
spec:
  description: Development applications project with relaxed controls

  sourceRepos:
  - '*'  # Allow any repository in dev

  destinations:
  - namespace: 'dev'
    server: https://kubernetes.default.svc
  - namespace: 'staging'
    server: https://kubernetes.default.svc

  clusterResourceWhitelist:
  - group: '*'
    kind: '*'

  namespaceResourceBlacklist:
  - group: ''
    kind: ResourceQuota
