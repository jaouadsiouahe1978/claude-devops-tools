<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Multi-Tier App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .status {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .status-item {
            flex: 1;
            min-width: 150px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            background: #f5f5f5;
            border: 2px solid #ddd;
        }
        .status-item.ok {
            border-color: #4caf50;
            background: #e8f5e9;
        }
        .status-item.error {
            border-color: #f44336;
            background: #ffebee;
        }
        .status-label {
            font-weight: bold;
            color: #333;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .status-value {
            font-size: 1.2em;
            color: #666;
        }
        .section {
            margin: 30px 0;
        }
        .section h2 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .info-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        .info-item strong {
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        .info-item span {
            color: #666;
            font-family: monospace;
            word-break: break-all;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background: #764ba2;
        }
        .button-group {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .messages {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .message-item {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            border-left: 3px solid #667eea;
            font-size: 0.9em;
        }
        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Kubernetes Multi-Tier App</h1>
        <p class="subtitle">Frontend (Nginx) → Backend (Flask) → Database (MySQL)</p>

        <div class="status">
            <div class="status-item ok">
                <div class="status-label">Frontend</div>
                <div class="status-value">✓ Running</div>
            </div>
            <div class="status-item" id="api-status">
                <div class="status-label">API Backend</div>
                <div class="status-value" id="api-status-value">? Checking</div>
            </div>
            <div class="status-item" id="db-status">
                <div class="status-label">Database</div>
                <div class="status-value" id="db-status-value">? Checking</div>
            </div>
        </div>

        <div class="section">
            <h2>📊 System Information</h2>
            <div class="info-grid">
                <div class="info-item">
                    <strong>Service</strong>
                    <span id="service">Loading...</span>
                </div>
                <div class="info-item">
                    <strong>Environment</strong>
                    <span id="environment">Loading...</span>
                </div>
                <div class="info-item">
                    <strong>API Endpoint</strong>
                    <span id="endpoint">Loading...</span>
                </div>
                <div class="info-item">
                    <strong>Database Host</strong>
                    <span id="db-host">Loading...</span>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>💬 Messages</h2>
            <div class="button-group">
                <button onclick="fetchMessages()">Fetch Messages</button>
                <button onclick="checkHealth()">Check Health</button>
            </div>
            <div class="messages" id="messages">No messages loaded yet.</div>
        </div>
    </div>

    <script>
        // Auto-check API health on load
        window.addEventListener('load', () => {
            checkHealth();
            fetchAppInfo();
            fetchMessages();
        });

        function checkHealth() {
            fetch('/api/health')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('api-status').classList.add('ok');
                    document.getElementById('api-status-value').textContent = '✓ Online';
                })
                .catch(err => {
                    document.getElementById('api-status').classList.add('error');
                    document.getElementById('api-status-value').textContent = '✗ Offline';
                });
        }

        function fetchAppInfo() {
            fetch('/api/info')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('service').textContent = data.app;
                    document.getElementById('environment').textContent = data.environment;
                    document.getElementById('endpoint').textContent = 'http://localhost:5000';
                    document.getElementById('db-host').textContent = data.db_host;
                    document.getElementById('db-status').classList.add('ok');
                    document.getElementById('db-status-value').textContent = '✓ Connected';
                })
                .catch(err => {
                    document.getElementById('db-status').classList.add('error');
                    document.getElementById('db-status-value').textContent = '✗ Error';
                });
        }

        function fetchMessages() {
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML = '<span class="loading">⏳</span> Loading...';

            fetch('/api/messages')
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data) && data.length > 0) {
                        msgDiv.innerHTML = data.map(m =>
                            `<div class="message-item"><strong>#${m.id}</strong><br>${m.content}<br><small>${m.created_at}</small></div>`
                        ).join('');
                    } else {
                        msgDiv.innerHTML = '<p>No messages available. Check the database.</p>';
                    }
                })
                .catch(err => {
                    msgDiv.innerHTML = `<p style="color: red;">Error loading messages: ${err.message}</p>`;
                });
        }
    </script>
</body>
</html>
