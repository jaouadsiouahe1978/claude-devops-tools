version: '3.8'

# Volumes persistants
volumes:
  registry_data:
    driver: local

# Networks
networks:
  devops-stack:
    driver: bridge

services:
  # ✅ Docker Registry local (v2)
  registry:
    image: registry:2.8-alpine
    container_name: local-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_LOG_LEVEL: info
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - devops-stack
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/v2/" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      description: "Local Docker Registry for testing push/pull"

  # ✅ Application Node.js (optimisée)
  app:
    build:
      context: .
      dockerfile: app/Dockerfile.optimized
    image: app:optimized
    container_name: docker-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
    networks:
      - devops-stack
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - registry
    labels:
      description: "Optimized Node.js app with multi-stage build"
      version: "1.0.0"

  # ✅ Nginx reverse proxy
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: nginx:optimized
    container_name: docker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - devops-stack
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      description: "Nginx reverse proxy and load balancer"

  # ✅ Container de développement (optionnel)
  dev:
    image: node:18-alpine
    container_name: docker-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /workspace/app/node_modules
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
    networks:
      - devops-stack
    profiles:
      - dev
    command: sh -c "npm install && npm start"
    stdin_open: true
    tty: true

  # ✅ Container de test/monitoring
  monitor:
    image: busybox:latest
    container_name: docker-monitor
    networks:
      - devops-stack
    profiles:
      - monitoring
    command: >
      sh -c "
      echo 'Monitoring stack health...' &&
      while true; do
        echo '[$(date)] Checking services...' &&
        wget -q -O- http://app:3000/health && echo ' - App OK' ||
        echo ' - App FAIL' &&
        wget -q -O- http://nginx/health && echo ' - Nginx OK' ||
        echo ' - Nginx FAIL' &&
        wget -q -O- http://registry:5000/v2/ && echo ' - Registry OK' ||
        echo ' - Registry FAIL' &&
        sleep 10;
      done
      "
    depends_on:
      - app
      - nginx
      - registry
