# Helm values for Nginx Ingress Controller
# Usage: helm install nginx-ingress ingress-nginx/ingress-nginx -f helm-values.yaml

controller:
  replicaCount: 2

  image:
    repository: registry.k8s.io/ingress-nginx/controller
    tag: "v1.9.0"
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    ports:
      http: 80
      https: 443
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    use-proxy-protocol: "false"
    enable-modsecurity: "true"
    enable-cors: "true"
    enable-metrics: "true"
    metrics-per-host: "true"
    worker-processes: "auto"
    worker-connections: "10240"
    keepalive-timeout: "65"
    keepalive-requests: "100"
    log-format-upstream: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"'
    enable-gzip: "true"
    gzip-level: "6"
    gzip-types: "text/plain text/css text/xml text/javascript application/json"
    ssl-min-version: "TLSv1.2"
    ssl-protocols: "TLSv1.2 TLSv1.3"
    ssl-ciphers: "ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
    ssl-prefer-server-ciphers: "on"
    hsts: "true"
    hsts-max-age: "2592000"
    hsts-include-subdomains: "true"

  livenessProbe:
    httpGet:
      path: /healthz
      port: 10254
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz
      port: 10254
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

  metrics:
    enabled: true
    service:
      port: 10254

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - ingress-nginx
          topologyKey: kubernetes.io/hostname

defaultBackend:
  enabled: true
  image:
    repository: registry.k8s.io/defaultbackend-amd64
    tag: "1.5"
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 20Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

rbac:
  create: true

serviceAccount:
  create: true
  name: nginx-ingress
