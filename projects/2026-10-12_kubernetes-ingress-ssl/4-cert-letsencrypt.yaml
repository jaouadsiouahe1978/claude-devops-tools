---
# ClusterIssuer pour Let's Encrypt Staging (pour test, moins de rate limit)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Serveur ACME de staging Let's Encrypt
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.com  # À adapter avec email réel
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    # HTTP-01 solver (plus simple)
    - http01:
        ingress:
          class: nginx
    # DNS-01 solver (pour wildcards, plus complexe)
    # - dns01:
    #     cloudflare:
    #       email: your-email@example.com
    #       apiTokenSecretRef:
    #         name: cloudflare-api-token
    #         key: api-token

---
# ClusterIssuer pour Let's Encrypt Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Serveur ACME de production Let's Encrypt
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com  # À adapter avec email réel
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    # HTTP-01 solver
    - http01:
        ingress:
          class: nginx
          serviceType: ClusterIP
    # Vous pouvez ajouter plusieurs solvers pour différents domaines
    - selector:
        dnsNames:
        - "*.example.com"
      dns01:
        # Configurez votre DNS provider ici
        cloudflare:
          email: your-email@example.com
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token

---
# Issuer namespace-scoped pour Let's Encrypt Staging
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-staging
  namespace: default
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Issuer namespace-scoped pour Let's Encrypt Production
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-prod
  namespace: default
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Certificate Let's Encrypt Staging Example
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-com-staging
  namespace: default
spec:
  secretName: example-com-staging-tls
  issuerRef:
    name: letsencrypt-staging
    kind: Issuer
  commonName: example.com
  dnsNames:
  - example.com
  - www.example.com
  - api.example.com
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days

---
# Certificate Let's Encrypt Production Example
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-com-prod
  namespace: default
spec:
  secretName: example-com-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: Issuer
  commonName: example.com
  dnsNames:
  - example.com
  - www.example.com
  - api.example.com
  - admin.example.com
  duration: 2160h
  renewBefore: 720h

---
# ServiceMonitor pour cert-manager metrics (si Prometheus est installé)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  endpoints:
  - port: tcp-prometheus-servicemonitor
    interval: 30s
    path: /metrics
