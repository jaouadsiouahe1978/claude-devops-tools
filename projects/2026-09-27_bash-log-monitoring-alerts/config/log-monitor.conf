# Log Monitor Configuration
# Format: KEY=VALUE

# Logs à monitorer (séparés par :)
LOG_FILES="/var/log/syslog:/var/log/auth.log:/var/log/apt/history.log"

# Patterns d'erreurs à détecter (regex)
declare -A ERROR_PATTERNS=(
    [CRITICAL]="CRITICAL|FATAL|PANIC"
    [ERROR]="ERROR|FAIL"
    [WARNING]="WARNING|WARN"
    [AUTH]="authentication failure|invalid user|sudo.*COMMAND"
    [KERNEL]="kernel:.*Error|Out of memory"
)

# Email pour les alertes
ALERT_EMAIL="admin@example.com"
ALERT_FROM="log-monitor@localhost"
ALERT_SUBJECT_PREFIX="[LOG ALERT]"

# Rate limiting (secondes entre alertes du même type)
ALERT_THROTTLE_SECONDS=300

# État du monitoring
STATE_DIR="/var/log/log-monitor"
STATE_FILE="${STATE_DIR}/monitor.state"
ALERT_CACHE="${STATE_DIR}/alert.cache"

# Mode debug (1 = actif, 0 = inactif)
DEBUG=0

# Nb de lignes à garder en historique
HISTORY_LINES=20

# Email ou type d'alerte (mail, webhook, slack)
ALERT_METHOD="mail"

# Webhook URL (si ALERT_METHOD=webhook)
WEBHOOK_URL=""

# Slack webhook (si ALERT_METHOD=slack)
SLACK_WEBHOOK=""
