version: '3.8'

services:
  # Traefik Reverse Proxy & Load Balancer
  traefik:
    image: traefik:v3.1
    container_name: traefik-main
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard
    environment:
      - TZ=UTC
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./dynamic-config.yml:/dynamic-config.yml:ro
      - ./acme.json:/acme.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
    restart: unless-stopped

  # Web Service 1 - Nginx
  web1:
    image: nginx:alpine
    container_name: web1-service
    networks:
      - traefik-network
    volumes:
      - ./services/web1/index.html:/usr/share/nginx/html/index.html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web1.rule=Host(`web1.localhost`)"
      - "traefik.http.routers.web1.entrypoints=web"
      - "traefik.http.services.web1.loadbalancer.server.port=80"
      # Middleware: redirect to HTTPS
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.web1.middlewares=https-redirect@docker"
    restart: unless-stopped
    depends_on:
      - traefik

  # Web Service 2 - Apache
  web2:
    image: httpd:2.4-alpine
    container_name: web2-service
    networks:
      - traefik-network
    volumes:
      - ./services/web2/index.html:/usr/local/apache2/htdocs/index.html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web2.rule=Host(`web2.localhost`)"
      - "traefik.http.routers.web2.entrypoints=web"
      - "traefik.http.services.web2.loadbalancer.server.port=80"
    restart: unless-stopped
    depends_on:
      - traefik

  # API Service - Python Flask
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: api-service
    networks:
      - traefik-network
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=5000"
      # Rate limiting middleware
      - "traefik.http.middlewares.api-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.burst=20"
      - "traefik.http.routers.api.middlewares=api-ratelimit@docker"
    restart: unless-stopped
    depends_on:
      - traefik

networks:
  traefik-network:
    driver: bridge
