<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Service 1 - Nginx</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            margin: 10px 5px;
            font-size: 14px;
        }
        .info {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }
        .info p {
            margin: 10px 0;
            color: #333;
        }
        .info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Web Service 1</h1>
        <span class="badge">Nginx</span>
        <span class="badge">Port 80</span>

        <div class="info">
            <p><strong>Status:</strong> ✅ Running</p>
            <p><strong>Container:</strong> web1-service</p>
            <p><strong>Image:</strong> nginx:alpine</p>
            <p><strong>Hostname:</strong> web1.localhost</p>
            <p><strong>Routed via Traefik</strong></p>
        </div>

        <p style="color: #666; margin-top: 20px;">
            This service is running on Nginx and is being reverse proxied through Traefik.
            Try accessing it via HTTP or HTTPS!
        </p>
    </div>
</body>
</html>
