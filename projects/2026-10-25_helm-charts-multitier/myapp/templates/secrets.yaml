apiVersion: v1
kind: Secret
metadata:
  name: {{ include "myapp.fullname" . }}-secrets
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-user: {{ .Values.postgres.env.POSTGRES_USER | quote }}
  postgres-password: {{ .Values.postgres.env.POSTGRES_PASSWORD | quote }}
  postgres-db: {{ .Values.postgres.env.POSTGRES_DB | quote }}
  db-password: {{ .Values.postgres.env.POSTGRES_PASSWORD | quote }}
