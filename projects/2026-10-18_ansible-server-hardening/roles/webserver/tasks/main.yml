---
# Webserver role: Nginx installation and configuration

- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Create Nginx configuration from template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: Restart Nginx

- name: Enable Nginx service
  systemd:
    name: nginx
    enabled: yes
    state: started

- name: Create web root directory
  file:
    path: "{{ app_home }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'

- name: Create sample index.html
  copy:
    content: |
      <!DOCTYPE html>
      <html>
      <head>
          <title>Welcome to {{ inventory_hostname }}</title>
          <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              h1 { color: #333; }
              .info { background: #f0f0f0; padding: 10px; border-radius: 5px; }
          </style>
      </head>
      <body>
          <h1>Welcome to {{ inventory_hostname }}</h1>
          <div class="info">
              <p><strong>Server:</strong> {{ inventory_hostname }}</p>
              <p><strong>IP Address:</strong> {{ ansible_default_ipv4.address }}</p>
              <p><strong>OS:</strong> {{ ansible_distribution }} {{ ansible_distribution_version }}</p>
              <p><strong>Kernel:</strong> {{ ansible_kernel }}</p>
          </div>
          <p>This server is managed by Ansible.</p>
      </body>
      </html>
    dest: "{{ app_home }}/index.html"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0644'

- name: Test Nginx configuration
  command: nginx -t
  changed_when: false
  register: nginx_test_result

- name: Ensure Nginx is running
  systemd:
    name: nginx
    state: restarted
