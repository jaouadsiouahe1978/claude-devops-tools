---
# Monitoring role: Install Prometheus Node Exporter

- name: Create node_exporter user
  user:
    name: node_exporter
    shell: /bin/false
    createhome: no
    state: present

- name: Download Node Exporter
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
    mode: '0644'
  register: node_exporter_download
  until: node_exporter_download is succeeded
  retries: 3

- name: Extract Node Exporter
  unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: yes
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Copy node_exporter binary
  copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: '0755'
    remote_src: yes
  notify: Restart Node Exporter

- name: Create Node Exporter systemd service
  copy:
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      Documentation=https://github.com/prometheus/node_exporter
      After=network.target

      [Service]
      Type=simple
      User=node_exporter
      Group=node_exporter
      ExecStart=/usr/local/bin/node_exporter \
        --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/) \
        --collector.netdev.device-exclude=^(veth.*)$ \
        --web.listen-address=:{{ node_exporter_port }}

      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Node Exporter

- name: Enable and start Node Exporter
  systemd:
    name: node_exporter
    enabled: yes
    state: started
    daemon_reload: yes

- name: Allow Node Exporter port through firewall
  ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
  when: firewall_enabled is defined and firewall_enabled

- name: Verify Node Exporter is running
  uri:
    url: "http://localhost:{{ node_exporter_port }}/metrics"
    method: GET
    status_code: 200
  register: node_exporter_status
  retries: 5
  delay: 2
  until: node_exporter_status.status == 200

- name: Clean up temporary files
  file:
    path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64*"
    state: absent
