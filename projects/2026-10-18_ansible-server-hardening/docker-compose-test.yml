version: '3.8'

# Docker Compose for local Ansible testing
# Spin up 3 test containers: 2 webservers + 1 database

services:
  web1:
    image: ubuntu:22.04
    container_name: web1
    hostname: web1.local
    networks:
      - test_net
    command: /bin/bash -c "apt-get update && apt-get install -y openssh-server sudo && mkdir -p /run/sshd && /usr/sbin/sshd -D"
    ports:
      - "2201:22"
    environment:
      - ROOT_PASSWORD=ansible123
    healthcheck:
      test: ["CMD", "ssh", "-o", "StrictHostKeyChecking=no", "root@localhost", "echo", "SSH ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  web2:
    image: ubuntu:22.04
    container_name: web2
    hostname: web2.local
    networks:
      - test_net
    command: /bin/bash -c "apt-get update && apt-get install -y openssh-server sudo && mkdir -p /run/sshd && /usr/sbin/sshd -D"
    ports:
      - "2202:22"
    environment:
      - ROOT_PASSWORD=ansible123
    healthcheck:
      test: ["CMD", "ssh", "-o", "StrictHostKeyChecking=no", "root@localhost", "echo", "SSH ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  db1:
    image: ubuntu:22.04
    container_name: db1
    hostname: db1.local
    networks:
      - test_net
    command: /bin/bash -c "apt-get update && apt-get install -y openssh-server sudo && mkdir -p /run/sshd && /usr/sbin/sshd -D"
    ports:
      - "2203:22"
    environment:
      - ROOT_PASSWORD=ansible123
    healthcheck:
      test: ["CMD", "ssh", "-o", "StrictHostKeyChecking=no", "root@localhost", "echo", "SSH ok"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  test_net:
    driver: bridge
