name: Container Security Scanning with Trivy

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'projects/2026-09-24_container-security-scanning/Dockerfile*'
      - 'projects/2026-09-24_container-security-scanning/.github/workflows/trivy-scan.yml'
  pull_request:
    branches: [ main ]
  schedule:
    # Scan daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/container-scanner

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./projects/2026-09-24_container-security-scanning
          file: ./projects/2026-09-24_container-security-scanning/Dockerfile
          push: false
          load: true
          tags: container-scanner:${{ github.sha }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-scanner:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'Trivy'

      - name: Run Trivy scan - Table format
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-scanner:${{ github.sha }}
          format: 'table'
          output: 'trivy-results.txt'

      - name: Run Trivy scan - JSON format
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-scanner:${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'

      - name: Run Trivy scan - SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-scanner:${{ github.sha }}
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: trivy-scan-results
          path: |
            trivy-results.txt
            trivy-results.json
            sbom.json
          retention-days: 30

      - name: Comment PR with scan results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('trivy-results.txt', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Trivy Security Scan Results\n\n\`\`\`\n${results}\n\`\`\``
            });

  scan-base-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        image:
          - 'ubuntu:22.04'
          - 'alpine:latest'
          - 'python:3.11-slim'
          - 'nginx:latest'
          - 'node:20-alpine'

    steps:
      - name: Run Trivy scan on base image - ${{ matrix.image }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: 'json'
          output: 'trivy-${{ matrix.image }}.json'
        continue-on-error: true

      - name: Upload base image scan results
        uses: actions/upload-artifact@v3
        with:
          name: base-image-scans
          path: 'trivy-*.json'
          retention-days: 30
