version: '3.9'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: SecurePass123!
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:18-alpine
    command: sh -c "npm install express pg && node /app/server.js"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_USER: appuser
      DB_PASSWORD: SecurePass123!
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/server.js:/app/server.js

  nginx:
    image: nginx:1.24-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
