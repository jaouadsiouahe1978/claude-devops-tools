---
# PostgreSQL StatefulSet with PersistentVolume
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: webapp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: webapp
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:14-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_NAME
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "pg_isready -U $POSTGRES_USER"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "pg_isready -U $POSTGRES_USER"]
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          defaultMode: 0755
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: webapp
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# ConfigMap for PostgreSQL initialization
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: webapp
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS users (
      id SERIAL PRIMARY KEY,
      name VARCHAR(255) NOT NULL,
      email VARCHAR(255) UNIQUE NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    INSERT INTO users (name, email) VALUES
      ('Alice Dupont', 'alice@example.com'),
      ('Bob Martin', 'bob@example.com'),
      ('Charlie Durand', 'charlie@example.com')
    ON CONFLICT (email) DO NOTHING;
---
# Node.js API Deployment
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: webapp
data:
  NODE_ENV: production
  PORT: "3000"
  DB_HOST: postgres-service
  DB_PORT: "5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: webapp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: api
        image: node:18-alpine
        command:
        - sh
        - -c
        - |
          npm install express pg dotenv prom-client &&
          node /app/server.js
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-credentials
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: app-code
          mountPath: /app
      volumes:
      - name: app-code
        configMap:
          name: app-code
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-code
  namespace: webapp
data:
  server.js: |
    const express = require('express');
    const { Pool } = require('pg');
    const app = express();
    app.use(express.json());
    const pool = new Pool({
      user: process.env.DB_USER || 'appuser',
      password: process.env.DB_PASSWORD || 'apppass',
      host: process.env.DB_HOST || 'postgres-service',
      port: process.env.DB_PORT || 5432,
      database: process.env.DB_NAME || 'appdb',
    });
    app.get('/health', async (req, res) => {
      try {
        await pool.query('SELECT NOW()');
        res.json({ status: 'healthy' });
      } catch (error) {
        res.status(503).json({ status: 'unhealthy' });
      }
    });
    app.get('/ready', async (req, res) => {
      try {
        await pool.query('SELECT version()');
        res.json({ ready: true });
      } catch (error) {
        res.status(503).json({ ready: false });
      }
    });
    app.get('/api/users', async (req, res) => {
      try {
        const result = await pool.query('SELECT id, name, email, created_at FROM users ORDER BY id');
        res.json({ success: true, data: result.rows, count: result.rows.length });
      } catch (error) {
        res.status(500).json({ success: false, error: error.message });
      }
    });
    app.post('/api/users', async (req, res) => {
      try {
        const { name, email } = req.body;
        if (!name || !email) return res.status(400).json({ success: false, error: 'Missing fields' });
        const result = await pool.query('INSERT INTO users (name, email) VALUES ($1, $2) RETURNING *', [name, email]);
        res.status(201).json({ success: true, data: result.rows[0] });
      } catch (error) {
        res.status(500).json({ success: false, error: error.message });
      }
    });
    app.get('/', (req, res) => {
      res.json({ name: 'K8s Web App API', version: '1.0.0', endpoints: {'/api/users': 'GET/POST'} });
    });
    app.listen(3000, '0.0.0.0', () => console.log('API running'));
    process.on('SIGTERM', async () => { await pool.end(); process.exit(0); });
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: webapp
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000
---
# Nginx Reverse Proxy
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: webapp
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      upstream api_backend { server api-service:3000; }
      server {
        listen 80;
        location /health { access_log off; return 200 "healthy\n"; }
        location / { proxy_pass http://api_backend; proxy_set_header X-Real-IP $remote_addr; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: webapp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.24-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: webapp
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: webapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
