# Log Alert Rules Configuration
# Each line is a regex pattern that will trigger an alert if found in logs
# Lines starting with # are comments
# Lines starting with ! are excluded patterns

# === Common System Errors ===
ERROR
CRITICAL
EMERGENCY
ALERT
PANIC

# === Authentication Issues ===
Failed password
Authentication failure
Invalid user
Illegal user
Connection closed by [^l]
Connection closed by authenticating user

# === System Resource Issues ===
Out of memory
OOM
kill.*oom
No space left on device
Disk quota exceeded
Cannot allocate memory

# === Network Issues ===
Connection refused
Connection timeout
Network is unreachable
No route to host
ECONNREFUSED

# === Application Errors ===
Segmentation fault
Bus error
Aborted
core dumped
Exception
Fatal error

# === Daemon Issues ===
daemon failed
service stopped
service crashed
systemd.*failed

# === Database Issues ===
database.*error
database.*failed
SQL error
Database connection failed
Deadlock detected

# === Permission Issues ===
Permission denied
Operation not permitted
Access denied
EACCES

# === SSH Issues ===
Invalid SSH id_rsa key
Received disconnect from
Disconnect.*auth changed.*1024

# === Web Server Issues (if monitoring Apache/Nginx) ===
\[error\]
\[crit\]
connect.*failed
upstream.*error

# === Exclude patterns (performance optimization) ===
# Common non-critical messages that would cause false positives
!DEBUG
!INFO
!NOTICE
!systemd.*Started
!systemd.*Reached target
!timeout.*establishing.*connection
