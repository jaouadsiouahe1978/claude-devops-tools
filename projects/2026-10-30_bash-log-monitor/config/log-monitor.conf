# Log Monitor Configuration
# Define which logs to monitor and how to handle alerts

# Logs to monitor (space-separated paths)
# Example: "/var/log/syslog /var/log/auth.log /var/log/nginx/error.log"
LOGS_TO_MONITOR="/var/log/syslog /var/log/auth.log"

# Email address for alerts
ALERT_EMAIL="admin@example.com"

# Directory to store alerts and state
# Make sure this directory is writable
ALERT_DIR="/var/log/log-monitor"

# Log file for monitoring system itself
LOG_MONITOR_LOG="${ALERT_DIR}/log-monitor.log"

# Check interval in minutes (when using cron)
CHECK_INTERVAL=5

# Enable/disable email notifications
ENABLE_EMAIL_ALERTS=true

# Enable/disable file-based archiving
ENABLE_FILE_ARCHIVE=true

# Maximum number of lines to include in alert email
MAX_LINES_PER_ALERT=50

# Alert severity levels
# Can be: INFO, WARNING, ERROR, CRITICAL
ALERT_LEVEL="WARNING"

# Retry failed alerts (number of retries)
ALERT_RETRY_COUNT=3

# Email server configuration (optional)
# Leave blank to use system mail command
SMTP_SERVER=""
SMTP_PORT="25"
SMTP_USER=""
SMTP_PASSWORD=""

# Slack webhook URL for alerts (optional)
# If set, alerts will also be sent to Slack
SLACK_WEBHOOK_URL=""

# Discord webhook URL for alerts (optional)
DISCORD_WEBHOOK_URL=""

# Enable dry-run mode (don't send actual alerts, just log what would happen)
DRY_RUN=false

# Debug mode (verbose logging)
DEBUG_MODE=false
