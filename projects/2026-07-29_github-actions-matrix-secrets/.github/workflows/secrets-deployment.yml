name: Deploy with Secrets Management

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: docker.io
  IMAGE_NAME: devops-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Display Environment
        run: |
          echo "Deploying to: ${{ github.event.inputs.environment }}"
          echo "Deploy endpoint: ${{ vars.DEPLOY_ENDPOINT }}"
          echo "API Gateway: ${{ vars.API_GATEWAY }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to ${{ github.event.inputs.environment }}
        run: |
          echo "🚀 Deploying image to ${{ github.event.inputs.environment }}"

          # API Key is masked in logs automatically
          curl -X POST "${{ vars.DEPLOY_ENDPOINT }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
              "environment": "${{ github.event.inputs.environment }}",
              "api_key": "${{ secrets.API_KEY }}"
            }'

      - name: Database Migration
        if: github.event.inputs.environment == 'production'
        run: |
          echo "Running database migrations..."
          # Using secrets safely
          export DB_HOST="${{ secrets.DB_HOST }}"
          export DB_USER="${{ secrets.DB_USER }}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

          # Secrets are masked in logs
          echo "Connected to $DB_HOST"

          # Run migration script here
          # ./scripts/migrate-db.sh

      - name: Health Check
        run: |
          sleep 10
          if curl -f "${{ vars.DEPLOY_ENDPOINT }}/health"; then
            echo "✅ Deployment successful"
          else
            echo "❌ Health check failed"
            exit 1
          fi

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Deployment to ${{ github.event.inputs.environment }} - ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*GitHub Action Status*\nDeployment: ${{ job.status }}\nEnvironment: ${{ github.event.inputs.environment }}\nCommit: ${{ github.sha }}"
                  }
                }
              ]
            }
