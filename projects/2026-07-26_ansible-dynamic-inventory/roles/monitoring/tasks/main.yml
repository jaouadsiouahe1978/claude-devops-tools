---
# Rôle monitoring - Installation des agents de monitoring

- name: Installer Prometheus node_exporter
  block:
    - name: Télécharger node_exporter
      get_url:
        url: https://github.com/prometheus/node_exporter/releases/download/v1.6.1/node_exporter-1.6.1.linux-amd64.tar.gz
        dest: /tmp/node_exporter.tar.gz
        mode: '0440'
      register: node_exporter_download
      changed_when: false
      tags:
        - monitoring
        - prometheus

    - name: Extraire node_exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes
      tags:
        - monitoring
        - prometheus

    - name: Copier node_exporter en place
      copy:
        src: /tmp/node_exporter-1.6.1.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        remote_src: yes
      tags:
        - monitoring
        - prometheus

    - name: Créer l'utilisateur node_exporter
      user:
        name: node_exporter
        shell: /bin/false
        state: present
      tags:
        - monitoring
        - prometheus

    - name: Créer le service systemd node_exporter
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          Type=simple
          User=node_exporter
          Group=node_exporter
          ExecStart=/usr/local/bin/node_exporter \
            --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/) \
            --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$ \
            --collector.netdev.device-exclude=^(veth.*|br-.*)$$
          SyslogIdentifier=node_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: Restart node_exporter
      tags:
        - monitoring
        - prometheus

    - name: Démarrer et activer node_exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes
      tags:
        - monitoring
        - prometheus

    - name: Ouvrir le port Prometheus dans le firewall
      ufw:
        rule: allow
        port: '9100'
        proto: tcp
      when: ansible_os_family == "Debian"
      tags:
        - firewall
        - monitoring

  when: enable_monitoring | default(true)

- name: Configurer mtail pour le log processing (optionnel)
  block:
    - name: Installer mtail
      package:
        name: mtail
        state: present
      ignore_errors: yes
      tags:
        - monitoring
        - logs

  when: enable_monitoring | default(true)

- name: Installer rsyslog pour la centralisation des logs
  package:
    name: rsyslog
    state: present
  tags:
    - monitoring
    - logs

- name: Créer un répertoire de monitoring
  file:
    path: /opt/monitoring
    state: directory
    mode: '0755'
  tags:
    - monitoring

- name: Créer un script de health check
  copy:
    dest: /usr/local/bin/health_check.sh
    mode: '0755'
    content: |
      #!/bin/bash
      # Health check script
      echo "=== System Health Check ==="
      echo "Hostname: $(hostname)"
      echo "Uptime: $(uptime)"
      echo "Load: $(cat /proc/loadavg)"
      echo "Memory: $(free -m | grep Mem)"
      echo "Disk: $(df -h / | tail -1)"
      echo "Services:"
      systemctl is-active --quiet nginx && echo "  nginx: OK" || echo "  nginx: FAILED"
      systemctl is-active --quiet postgresql && echo "  postgres: OK" || echo "  postgres: FAILED"
      systemctl is-active --quiet node_exporter && echo "  node_exporter: OK" || echo "  node_exporter: FAILED"
  tags:
    - monitoring
