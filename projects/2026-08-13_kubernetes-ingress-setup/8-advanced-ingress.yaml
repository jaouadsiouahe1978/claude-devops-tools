---
# Ingress avancé avec réécritures d'URL
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: advanced-rewrite-ingress
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/ingress.ingressClassName: nginx
    # Réecriture de chemin
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization"
spec:
  rules:
  - host: api.local
    http:
      paths:
      # /v1/api/... -> /... (rewrite)
      - path: /v1(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: app2-service
            port:
              number: 80
      # /health -> /health (pas de rewrite)
      - path: /health
        pathType: Exact
        backend:
          service:
            name: app3-service
            port:
              number: 80

---
# Ingress avec Basic Auth
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/ingress.ingressClassName: nginx
    # Basic Auth (htpasswd file)
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
spec:
  rules:
  - host: secure.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1-service
            port:
              number: 80

---
# Secret pour Basic Auth
# Généré avec: htpasswd -c auth username password
# htpasswd -b auth admin password123
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: apps
type: Opaque
data:
  # admin:password123 (base64)
  auth: YWRtaW46cGFzc3dvcmQxMjMK

---
# Ingress avec Custom Headers
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: custom-headers-ingress
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/ingress.ingressClassName: nginx
    # Ajouter des headers personnalisés
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Custom-Header: MyValue";
      more_set_headers "X-App-Version: 1.0.0";
      more_set_headers "Cache-Control: public, max-age=3600";
spec:
  rules:
  - host: custom.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1-service
            port:
              number: 80

---
# Ingress avec Canary Deployment (Blue-Green)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: canary-ingress
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/ingress.ingressClassName: nginx
    # Envoyer 10% du trafic vers le canary
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  rules:
  - host: canary.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            # Version canary
            name: app3-service
            port:
              number: 80

---
# Ingress principal pour le canary (90% du trafic)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/ingress.ingressClassName: nginx
spec:
  rules:
  - host: canary.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            # Version stable
            name: app1-service
            port:
              number: 80

---
# Ingress avec Rate Limiting
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ratelimit-ingress
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/ingress.ingressClassName: nginx
    # 10 requêtes par seconde
    nginx.ingress.kubernetes.io/limit-rps: "10"
    # 5 connexions simultanées par IP
    nginx.ingress.kubernetes.io/limit-connections: "5"
    # Message d'erreur personnalisé
    nginx.ingress.kubernetes.io/limit-rps-status-code: "429"
spec:
  rules:
  - host: ratelimit.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app2-service
            port:
              number: 80

---
# Ingress avec Whitelist/Blacklist IP
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ip-restrict-ingress
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/ingress.ingressClassName: nginx
    # Autoriser uniquement ces IPs
    nginx.ingress.kubernetes.io/whitelist-source-range: "127.0.0.1,192.168.1.0/24"
spec:
  rules:
  - host: restricted.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1-service
            port:
              number: 80
