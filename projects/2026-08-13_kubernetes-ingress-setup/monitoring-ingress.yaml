---
# ServiceMonitor pour Prometheus (scraper les métriques du NGINX Ingress)
# Nécessite prometheus-operator ou Prometheus avec discover automatique
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nginx-ingress-metrics
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
# PrometheusRule pour les alertes
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nginx-ingress-rules
  namespace: ingress-nginx
spec:
  groups:
  - name: nginx-ingress
    interval: 30s
    rules:
    # Alerter si le controller est down
    - alert: NginxIngressControllerDown
      expr: up{job="ingress-nginx-metrics"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "NGINX Ingress Controller is down"
        description: "NGINX Ingress Controller has been down for more than 5 minutes"

    # Alerter sur le taux d'erreur HTTP 5xx
    - alert: NginxIngress5xxErrors
      expr: rate(nginx_ingress_controller_requests{status=~"5.."}[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High 5xx error rate in NGINX Ingress"
        description: "NGINX Ingress has {{ $value }} errors per second"

    # Alerter sur le taux d'erreur HTTP 4xx
    - alert: NginxIngress4xxErrors
      expr: rate(nginx_ingress_controller_requests{status=~"4.."}[5m]) > 0.1
      for: 10m
      labels:
        severity: info
      annotations:
        summary: "High 4xx error rate in NGINX Ingress"
        description: "NGINX Ingress has {{ $value }} errors per second"

    # Alerter si la latence est trop élevée
    - alert: NginxIngressHighLatency
      expr: histogram_quantile(0.95, rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High latency in NGINX Ingress"
        description: "P95 latency is {{ $value }}s"

