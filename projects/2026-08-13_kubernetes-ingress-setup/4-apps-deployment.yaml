---
# Application 1 - Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-frontend
  namespace: apps
  labels:
    app: app1
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
      tier: frontend
  template:
    metadata:
      labels:
        app: app1
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        env:
        - name: APP_NAME
          value: "App1 - Frontend"
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo '<h1>Welcome to App1 Frontend</h1><p>Pod: '$HOSTNAME'</p>' > /usr/share/nginx/html/index.html"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Service pour App1
apiVersion: v1
kind: Service
metadata:
  name: app1-service
  namespace: apps
  labels:
    app: app1
spec:
  type: ClusterIP
  selector:
    app: app1
    tier: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP

---
# Application 2 - Backend API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-backend
  namespace: apps
  labels:
    app: app2
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2
      tier: backend
  template:
    metadata:
      labels:
        app: app2
        tier: backend
    spec:
      containers:
      - name: api
        image: httpbin:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /status/200
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status/200
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Service pour App2
apiVersion: v1
kind: Service
metadata:
  name: app2-service
  namespace: apps
  labels:
    app: app2
spec:
  type: ClusterIP
  selector:
    app: app2
    tier: backend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP

---
# Application 3 - Simple Web Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-web
  namespace: apps
  labels:
    app: app3
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3
      tier: web
  template:
    metadata:
      labels:
        app: app3
        tier: web
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo '<h1>App3 - Health Check</h1><p>Version: 1.0</p>' > /usr/share/nginx/html/index.html && echo 'OK' > /usr/share/nginx/html/health"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5

---
# Service pour App3
apiVersion: v1
kind: Service
metadata:
  name: app3-service
  namespace: apps
  labels:
    app: app3
spec:
  type: ClusterIP
  selector:
    app: app3
    tier: web
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
