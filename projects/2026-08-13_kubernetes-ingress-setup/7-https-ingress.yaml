---
# Ingress avec SSL/TLS auto-généré (Self-signed)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1-https-ingress
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/ingress.ingressClassName: nginx
    cert-manager.io/cluster-issuer: "selfsigned-ca"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - app1.local
    - app1.example.com
    secretName: app1-tls-secret
  rules:
  - host: app1.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1-service
            port:
              number: 80
  - host: app1.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1-service
            port:
              number: 80

