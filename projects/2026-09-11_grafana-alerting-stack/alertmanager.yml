global:
  resolve_timeout: 5m

route:
  receiver: 'default-receiver'
  group_by: ['severity', 'job']
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/alert'

  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/alert'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['job', 'instance']
