# Configuration du Monitoring et Log Rotation
# Source ce fichier dans les scripts pour personnaliser le comportement

# ============================================================================
# ALERTES
# ============================================================================

# Email pour les alertes critiques
ALERT_EMAIL="admin@localhost"

# Options d'alerte
SEND_EMAIL_ALERTS=true
SEND_SLACK_ALERTS=false

# URL Slack Webhook (pour les notifications Slack)
SLACK_WEBHOOK_URL=""

# ============================================================================
# SEUILS DE MONITORING
# ============================================================================

# CPU Load (%)
CPU_THRESHOLD=80
CPU_WARNING_THRESHOLD=60

# Mémoire (%)
MEMORY_THRESHOLD=85
MEMORY_WARNING_THRESHOLD=70

# Disque (%)
DISK_THRESHOLD=80
DISK_WARNING_THRESHOLD=70

# Inodes (%)
INODE_THRESHOLD=85

# Utilisation SWAP (%)
SWAP_WARNING_THRESHOLD=50

# ============================================================================
# LOG FILES À SURVEILLER
# ============================================================================

LOG_FILES=(
    "/var/log/syslog"
    "/var/log/auth.log"
    "/var/log/kernel.log"
    "/var/log/messages"
    "/var/log/monitoring/system_health.log"
    "/var/log/monitoring/disk_check.log"
    "/var/log/monitoring/memory_check.log"
)

# ============================================================================
# PATTERNS D'ERREURS À DÉTECTER
# ============================================================================

ALERT_PATTERNS=(
    "ERROR"
    "FAILED"
    "CRITICAL"
    "FATAL"
    "panic"
    "segfault"
    "out of memory"
    "Connection refused"
    "Access denied"
)

# ============================================================================
# RÉTENTION DES LOGS
# ============================================================================

# Nombre de jours avant d'archiver les logs
LOG_ARCHIVE_DAYS=7

# Nombre de jours avant de supprimer les archives
LOG_RETENTION_DAYS=30

# Nombre de jours avant de compresser les archives
LOG_COMPRESS_DAYS=7

# ============================================================================
# RÉPERTOIRES
# ============================================================================

# Dossier des logs de monitoring
MONITORING_LOG_DIR="/var/log/monitoring"

# Dossier des backups de logs
LOG_BACKUP_DIR="/var/log/backups"

# ============================================================================
# FICHIERS DE LOCK
# ============================================================================

# Fichiers temporaires pour éviter les exécutions simultanées
LOCK_DIR="/tmp/monitoring"

# ============================================================================
# LOGGING
# ============================================================================

# Niveau de log (DEBUG, INFO, WARN, ERROR)
LOG_LEVEL="INFO"

# Détails dans les logs (true/false)
VERBOSE_LOGGING=false

# ============================================================================
# SCHEDULING
# ============================================================================

# Interval de vérification système (en minutes)
HEALTH_CHECK_INTERVAL=5

# Heure de rotation des logs (format HH:MM)
LOG_ROTATION_TIME="02:00"

# Heure de compression des logs (format HH:MM)
LOG_COMPRESSION_TIME="03:00"

# Heure de nettoyage des logs (format HH:MM)
LOG_CLEANUP_TIME="04:00"

# ============================================================================
# OPTIONS AVANCÉES
# ============================================================================

# Nombre de processus top à afficher
TOP_PROCESSES_COUNT=5

# Nombre de lignes à afficher des logs d'erreurs
LOG_ERROR_LINES=3

# Delimiter pour les exports CSV
CSV_DELIMITER=","

# ============================================================================
# PERSONNALISATIONS PAR ENVIRONNEMENT
# ============================================================================

# Environnement (dev, staging, prod)
ENVIRONMENT="prod"

# Hostname personnalisé (laisse vide pour utiliser le hostname système)
CUSTOM_HOSTNAME=""

# Tags pour les alertes
ALERT_TAGS="linux,sysadmin,devops"
