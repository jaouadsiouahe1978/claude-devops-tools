global:
  scrape_interval: 15s           # Fréquence de scrape par défaut
  evaluation_interval: 15s        # Fréquence d'évaluation des règles
  external_labels:
    cluster: 'local-dev'
    environment: 'development'

# Configuration du stockage des alertes
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Fichiers de règles d'alerte
rule_files: []

scrape_configs:
  # Prometheus se scrape lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter: métriques système
  - job_name: 'node-exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

  # Job custom: applications
  - job_name: 'applications'
    scrape_interval: 30s
    static_configs:
      - targets: []
    # À complété avec vos services applicatifs

remote_write: []
remote_read: []
