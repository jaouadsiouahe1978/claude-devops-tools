{{- if .Values.database.enabled }}
---
# Database Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "myapp.fullname" . }}-db-secret
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
    component: database
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.database.config.POSTGRES_PASSWORD | b64enc | quote }}
{{- end }}

---
# Application Secrets
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "myapp.fullname" . }}-secret
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
type: Opaque
data:
  # Add your sensitive data here (base64 encoded)
  # Example:
  # API_KEY: {{ .Values.secrets.apiKey | b64enc | quote }}
  # JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  PLACEHOLDER: {{ "changeme" | b64enc | quote }}
