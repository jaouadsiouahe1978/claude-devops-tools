---
# Main application ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myapp.fullname" . }}-config
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
data:
  LOG_LEVEL: "{{ .Values.config.LOG_LEVEL | default "INFO" }}"
  LOG_FORMAT: "{{ .Values.config.LOG_FORMAT | default "json" }}"
  MAX_CONNECTIONS: "{{ .Values.config.MAX_CONNECTIONS | default "100" }}"
  CACHE_TTL: "{{ .Values.config.CACHE_TTL | default "3600" }}"
  ENVIRONMENT: "{{ .Values.environment }}"

---
# Frontend Nginx Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myapp.fullname" . }}-frontend-config
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
    component: frontend
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location / {
        proxy_pass http://{{ include "myapp.fullname" . }}-backend:{{ .Values.backend.service.port }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
      }
    }

{{- if .Values.database.enabled }}
---
# Database Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myapp.fullname" . }}-db-config
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
    component: database
data:
  POSTGRES_DB: "{{ .Values.database.config.POSTGRES_DB }}"
  POSTGRES_USER: "{{ .Values.database.config.POSTGRES_USER }}"
  PGDATA: "/var/lib/postgresql/data/pgdata"
{{- end }}
