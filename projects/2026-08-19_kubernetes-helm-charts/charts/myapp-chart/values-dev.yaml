# Development environment overrides

environment: development

# Minimal resources for dev
frontend:
  replicas: 1
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  autoscaling:
    enabled: false

backend:
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false

database:
  persistence:
    enabled: false
    size: 1Gi

# Ingress disabled for dev (use port-forward)
ingress:
  enabled: false

# Debug logging
config:
  LOG_LEVEL: "DEBUG"
  CACHE_TTL: "300"

# More permissive security for dev
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  fsGroup: 0
