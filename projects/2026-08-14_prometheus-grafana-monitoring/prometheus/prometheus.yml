# Configuration Prometheus

global:
  scrape_interval: 15s        # Intervalle de scrape par défaut
  evaluation_interval: 15s    # Intervalle d'évaluation des règles
  external_labels:
    monitor: 'prometheus-app-monitor'

# Fichier de règles d'alertes
rule_files:
  - "/etc/prometheus/alerts.yml"

# Configuration d'AlertManager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Configuration des jobs à scraper
scrape_configs:
  # Scraper Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scraper l'application Node.js
  - job_name: 'app'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']
        labels:
          environment: 'development'
          team: 'devops'

  # Scraper AlertManager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

