groups:
  # ===== SYSTEM METRICS =====
  - name: system-recording-rules
    interval: 1m
    rules:
      # CPU Metrics
      - record: node:cpu:percentage
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

      - record: node:cpu:idle_percentage
        expr: avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100

      - record: node:cpu:system_percentage
        expr: avg by (instance) (irate(node_cpu_seconds_total{mode="system"}[5m])) * 100

      - record: node:cpu:user_percentage
        expr: avg by (instance) (irate(node_cpu_seconds_total{mode="user"}[5m])) * 100

      # Memory Metrics
      - record: node:memory:usage_percent
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100

      - record: node:memory:available_gb
        expr: node_memory_MemAvailable_bytes / (1024^3)

      - record: node:memory:total_gb
        expr: node_memory_MemTotal_bytes / (1024^3)

      - record: node:memory:used_gb
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / (1024^3)

      # Disk Metrics
      - record: node:disk:usage_percent
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100

      - record: node:disk:free_gb
        expr: node_filesystem_avail_bytes{mountpoint="/"} / (1024^3)

      - record: node:disk:total_gb
        expr: node_filesystem_size_bytes{mountpoint="/"} / (1024^3)

      - record: node:disk:read_rate
        expr: rate(node_disk_read_bytes_total[5m])

      - record: node:disk:write_rate
        expr: rate(node_disk_written_bytes_total[5m])

      # Network Metrics
      - record: node:network:bytes_in_rate
        expr: rate(node_network_receive_bytes_total{device="eth0"}[5m])

      - record: node:network:bytes_out_rate
        expr: rate(node_network_transmit_bytes_total{device="eth0"}[5m])

      - record: node:network:packets_in_rate
        expr: rate(node_network_receive_packets_total{device="eth0"}[5m])

      - record: node:network:packets_out_rate
        expr: rate(node_network_transmit_packets_total{device="eth0"}[5m])

      # Load Average
      - record: node:load:1min
        expr: node_load1

      - record: node:load:5min
        expr: node_load5

      - record: node:load:15min
        expr: node_load15

  # ===== DOCKER CONTAINER METRICS =====
  - name: container-recording-rules
    interval: 1m
    rules:
      # Container CPU
      - record: container:cpu:percentage
        expr: (rate(container_cpu_usage_seconds_total[5m]) / container_spec_cpu_quota) * 100

      # Container Memory
      - record: container:memory:usage_mb
        expr: container_memory_usage_bytes / (1024^2)

      - record: container:memory:limit_mb
        expr: container_spec_memory_limit_bytes / (1024^2)

      - record: container:memory:usage_percent
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100

      # Container Network
      - record: container:network:rx_rate
        expr: rate(container_network_receive_bytes_total[5m])

      - record: container:network:tx_rate
        expr: rate(container_network_transmit_bytes_total[5m])

  # ===== NGINX METRICS =====
  - name: nginx-recording-rules
    interval: 1m
    rules:
      # Request Rate
      - record: nginx:requests:rate
        expr: rate(nginx_http_requests_total[5m])

      # Request Rate by Status
      - record: nginx:requests:2xx_rate
        expr: rate(nginx_http_requests_total{status=~"2.."}[5m])

      - record: nginx:requests:4xx_rate
        expr: rate(nginx_http_requests_total{status=~"4.."}[5m])

      - record: nginx:requests:5xx_rate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m])

      # Error Rate
      - record: nginx:error_rate
        expr: (rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m])) * 100

      # Average Request Time
      - record: nginx:request_time:avg_ms
        expr: (rate(nginx_http_request_duration_seconds_sum[5m]) / rate(nginx_http_request_duration_seconds_count[5m])) * 1000

      # Connections
      - record: nginx:connections:active
        expr: nginx_connections_active

      - record: nginx:connections:reading
        expr: nginx_connections_reading

      - record: nginx:connections:writing
        expr: nginx_connections_writing

      - record: nginx:connections:waiting
        expr: nginx_connections_waiting

  # ===== POSTGRESQL METRICS =====
  - name: postgres-recording-rules
    interval: 1m
    rules:
      # Connection Count
      - record: postgres:connections:total
        expr: pg_stat_activity_count

      # Transactions
      - record: postgres:transactions:commit_rate
        expr: rate(pg_stat_database_xact_commit[5m])

      - record: postgres:transactions:rollback_rate
        expr: rate(pg_stat_database_xact_rollback[5m])

      # Rows
      - record: postgres:tuples:inserted_rate
        expr: rate(pg_stat_database_tup_inserted[5m])

      - record: postgres:tuples:updated_rate
        expr: rate(pg_stat_database_tup_updated[5m])

      - record: postgres:tuples:deleted_rate
        expr: rate(pg_stat_database_tup_deleted[5m])

      # Scans
      - record: postgres:scans:sequential_rate
        expr: rate(pg_stat_database_seq_scan[5m])

      - record: postgres:scans:index_rate
        expr: rate(pg_stat_database_idx_scan[5m])

      # Cache Hit Ratio
      - record: postgres:cache:hit_ratio
        expr: |
          sum(rate(pg_stat_database_heap_blks_hit[5m])) /
          (sum(rate(pg_stat_database_heap_blks_hit[5m])) + sum(rate(pg_stat_database_heap_blks_read[5m]))) * 100

  # ===== JVM / APPLICATION METRICS =====
  - name: application-recording-rules
    interval: 1m
    rules:
      # API Response Time
      - record: api:response_time:p50
        expr: histogram_quantile(0.50, rate(http_request_duration_seconds_bucket[5m]))

      - record: api:response_time:p95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))

      - record: api:response_time:p99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))

      # Request Rate by Endpoint
      - record: api:requests:by_endpoint
        expr: sum(rate(http_requests_total[5m])) by (endpoint)

      # Error Rate by Endpoint
      - record: api:errors:by_endpoint
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (endpoint)
