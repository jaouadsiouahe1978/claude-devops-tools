apiVersion: v1
kind: Secret
metadata:
  name: {{ include "myapp.fullname" . }}-db-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
type: Opaque
data:
  db-name: {{ .Values.database.secrets.dbName | b64enc | quote }}
  db-user: {{ .Values.database.secrets.dbUser | b64enc | quote }}
  db-password: {{ .Values.database.secrets.dbPassword | b64enc | quote }}
