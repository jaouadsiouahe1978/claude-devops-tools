# Default values for myapp Helm chart
# This is a YAML-formatted file.

global:
  environment: development
  domain: myapp.local
  timezone: UTC

namespace:
  create: true
  name: myapp

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2

  image:
    repository: myapp-frontend
    tag: "1.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    className: nginx
    path: /
    pathType: Prefix
    host: myapp.local

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

# API Backend configuration
api:
  enabled: true
  replicaCount: 2

  image:
    repository: myapp-api
    tag: "1.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  env:
    APP_ENV: development
    LOG_LEVEL: INFO

# Database (PostgreSQL) configuration
database:
  enabled: true

  image:
    repository: postgres
    tag: "15-alpine"

  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432

  storage:
    size: 10Gi
    storageClassName: standard

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # Secrets
  secrets:
    dbName: myapp
    dbUser: myapp
    # Password should be set via --set or secrets file
    dbPassword: changeme123

  persistence:
    enabled: true
    path: /var/lib/postgresql/data

# ConfigMap data
configmap:
  enabled: true
  api_config: |
    {
      "log_level": "INFO",
      "debug": false
    }

# Health checks
healthChecks:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Pod annotations
podAnnotations: {}

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Node affinity/anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - myapp-api
          topologyKey: kubernetes.io/hostname
