<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyApp - Kubernetes Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .info-section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .info-section h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #333;
        }

        .info-value {
            color: #666;
            word-break: break-word;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.healthy {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .api-section {
            margin-top: 30px;
        }

        .api-section h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 10px;
            width: 100%;
        }

        button:hover {
            background: #764ba2;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .response {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            color: #333;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 MyApp - Kubernetes Demo</h1>
        <p class="subtitle">Application déployée avec Helm sur Kubernetes</p>

        <div class="info-section">
            <h2>📊 État de l'application</h2>
            <div class="info-item">
                <span class="info-label">Statut:</span>
                <span class="info-value"><span class="status healthy">✓ HEALTHY</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">Frontend:</span>
                <span class="info-value"><span class="badge">Online</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">API Backend:</span>
                <span class="info-value" id="api-status"><span class="badge">Checking...</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">Environnement:</span>
                <span class="info-value" id="env-name">Chargement...</span>
            </div>
        </div>

        <div class="api-section">
            <h2>🔌 Test API</h2>
            <button onclick="testHealth()">Test Health Check</button>
            <button onclick="testInfo()">Récupérer Info Serveur</button>
            <button onclick="testDB()">Vérifier Base de Données</button>

            <div id="response" class="response" style="display:none;">
                <strong>Réponse:</strong>
                <pre id="response-text"></pre>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; color: #999; font-size: 12px;">
            <p>MyApp v1.0 | Kubernetes | Helm | Docker</p>
        </div>
    </div>

    <script>
        // Vérifier l'état de l'API au chargement
        checkApiStatus();
        getEnvName();

        function checkApiStatus() {
            fetch('/api/health')
                .then(r => r.text())
                .then(() => {
                    document.getElementById('api-status').innerHTML = '<span class="badge">Online</span>';
                })
                .catch(() => {
                    document.getElementById('api-status').innerHTML = '<span class="badge" style="background:#dc3545;">Offline</span>';
                });
        }

        function getEnvName() {
            fetch('/api/info')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('env-name').textContent = data.environment || 'development';
                })
                .catch(() => {
                    document.getElementById('env-name').textContent = 'unknown';
                });
        }

        function testHealth() {
            makeRequest('/api/health', 'Health Check');
        }

        function testInfo() {
            makeRequest('/api/info', 'Server Info');
        }

        function testDB() {
            makeRequest('/api/db-status', 'Database Status');
        }

        function makeRequest(url, title) {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Chargement...';

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    showResponse(title, data);
                })
                .catch(err => {
                    showResponse(title, { error: err.message });
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = 'Tester';
                });
        }

        function showResponse(title, data) {
            const responseDiv = document.getElementById('response');
            const textDiv = document.getElementById('response-text');
            textDiv.textContent = JSON.stringify(data, null, 2);
            responseDiv.style.display = 'block';
            responseDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Actualiser le statut API toutes les 30 secondes
        setInterval(checkApiStatus, 30000);
    </script>
</body>
</html>
