# PostgreSQL Configuration for Primary (Streaming Replication)

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Replication settings (CRITICAL)
wal_level = replica                          # Enable replication
max_wal_senders = 3                          # Number of WAL sender processes
wal_keep_size = 1GB                          # Min size of WAL files to keep
max_replication_slots = 3                    # Maximum replication slots
synchronous_commit = remote_apply            # Wait for standby to apply changes
synchronous_standby_names = '*'              # All standby servers must acknowledge

# WAL (Write-Ahead Logging) settings
wal_compression = on                         # Compress WAL files
wal_log_hints = on                           # Hint bits for index builds

# Checkpoints and memory
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 64MB

# Query performance
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB
log_statement = 'all'
log_duration = on
log_min_duration_statement = 1000           # Log queries > 1 second

# Hot Standby settings (for reading from standby)
hot_standby = on
hot_standby_feedback = on                   # Tell primary about standby activity

# Archive WAL (optional but recommended for recovery)
archive_mode = on
archive_command = '/bin/true'               # Placeholder - use with backup solution

# Client connection defaults
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
