# PostgreSQL Configuration for Standby (Streaming Replication)

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Replication settings (CRITICAL)
wal_level = replica
max_wal_senders = 3
wal_keep_size = 1GB
max_replication_slots = 3

# WAL settings
wal_compression = on
wal_log_hints = on

# Checkpoints and memory
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 64MB

# Query performance
random_page_cost = 1.1
effective_io_concurrency = 200

# Hot Standby (enable reading on standby)
hot_standby = on
hot_standby_feedback = on                   # Tell primary about standby queries

# Replication connection settings
primary_conninfo = 'host=pg_primary port=5432 user=replicator password=repl_password'
restore_command = '/bin/true'               # Placeholder

# Logging
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB
log_statement = 'all'
log_duration = on
log_min_duration_statement = 1000

# Client connection defaults
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
