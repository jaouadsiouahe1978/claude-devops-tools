version: '3.9'

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cicd-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - FLASK_ENV=development
      - APP_VERSION=1.0.0
      - DEBUG=True
    volumes:
      - .:/app
    command: >
      bash -c "pip install -r requirements.txt &&
               python -m pytest tests/ -v &&
               python -m flask run --host=0.0.0.0 --port=8000"
    networks:
      - cicd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # PostgreSQL for future database needs
  postgres:
    image: postgres:15-alpine
    container_name: cicd-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: cicd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cicd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: cicd-cache
    ports:
      - "6379:6379"
    networks:
      - cicd-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: cicd-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - cicd-network

volumes:
  postgres_data:

networks:
  cicd-network:
    driver: bridge
