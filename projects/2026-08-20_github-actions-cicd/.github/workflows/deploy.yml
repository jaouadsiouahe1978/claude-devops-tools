name: Deploy Application

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    environment:
      name: staging
      url: https://staging-app.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

      - name: Deploy to staging environment
        run: |
          echo "🚀 Deploying to staging..."
          # Replace with your actual deployment script
          # Example: ssh deploy@staging-server 'cd /app && docker-compose pull && docker-compose up -d'
          echo "✅ Deployment to staging complete"

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests on staging..."
          # Replace with your actual smoke tests
          # Example: curl -f https://staging-app.example.com/health
          echo "✅ Smoke tests passed"

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://app.example.com
    needs: [deploy-staging]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🏷️ Deploying version $VERSION"

      - name: Pull release image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}

      - name: Create deployment
        id: deployment
        run: |
          echo "🚀 Creating production deployment for v${{ steps.version.outputs.version }}..."
          DEPLOYMENT_ID=$(date +%s)
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          # Replace with your actual deployment script
          # Example: ssh deploy@prod-server 'cd /app && docker-compose pull && docker-compose up -d'
          echo "✅ Production deployment complete"

      - name: Run health checks
        run: |
          echo "🏥 Running production health checks..."
          # Replace with your actual health checks
          # Example: curl -f https://app.example.com/health
          sleep 2
          echo "✅ All health checks passed"

      - name: Notify production deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            Production deployment ${{ job.status }}
            Version: v${{ steps.version.outputs.version }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Release v${{ steps.version.outputs.version }}

            ### Deployment Status
            - ✅ Staging: Passed
            - ✅ Production: Deployed

            ### Changes
            See commit log for details: https://github.com/${{ github.repository }}/commits/v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false

  rollback:
    name: Rollback (if needed)
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy-production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback to previous version
        run: |
          echo "⚠️ Deployment failed. Rolling back..."
          # Replace with your actual rollback script
          # Example: ssh deploy@prod-server 'cd /app && docker-compose pull origin/previous && docker-compose up -d'
          echo "✅ Rollback complete"

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production rollback initiated'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
