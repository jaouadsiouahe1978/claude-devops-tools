[webservers]
web-server-1 ansible_host=172.20.0.2 nginx_port=80 nginx_worker_processes=2
web-server-2 ansible_host=172.20.0.3 nginx_port=80 nginx_worker_processes=2
web-server-3 ansible_host=172.20.0.4 nginx_port=80 nginx_worker_processes=2

[webservers:vars]
ansible_user=root
ansible_password=root
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3

[all:vars]
environment_name=production
