version: '3.8'

services:
  # ==========================================
  # TRAEFIK - Reverse Proxy & Load Balancer
  # ==========================================
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
      - "8080:8080"  # Dashboard (non-secure)
    environment:
      - TRAEFIK_API_INSECURE=false
      - TRAEFIK_API_DASHBOARD=true
      - TRAEFIK_LOG_LEVEL=INFO
      - TRAEFIK_PROVIDERS_DOCKER=true
      - TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT=false
      - TRAEFIK_PROVIDERS_DOCKER_NETWORK=proxy
      - TRAEFIK_ENTRYPOINTS_WEB_ADDRESS=:80
      - TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS=:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-certs:/certs-acme
      - ./traefik.yml:/traefik.yml:ro
      - ./traefik-config.toml:/traefik-config.toml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls=true
      - traefik.http.services.traefik.loadbalancer.server.port=8080
      - traefik.http.routers.traefik.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$2y$$05$$VnKBz/zzMqWW3SnE2dDJPOwNsBXHd8V.46cI4h2GjKnz1OlnmALHe
    depends_on:
      - api1
      - api2
      - app

  # ==========================================
  # SERVICES BACKEND - Flask Applications
  # ==========================================
  api1:
    build: .
    container_name: api1
    restart: always
    networks:
      - proxy
    environment:
      - SERVICE_NAME=API Service 1
      - SERVICE_PORT=5000
      - SERVICE_COLOR=blue
    labels:
      - traefik.enable=true
      - traefik.http.routers.api1.rule=Host(`api1.localhost`)
      - traefik.http.routers.api1.entrypoints=web,websecure
      - traefik.http.routers.api1.tls=true
      - traefik.http.services.api1.loadbalancer.server.port=5000
      - traefik.http.middlewares.api1-compress.compress=true
      - traefik.http.routers.api1.middlewares=api1-compress,security-headers

  api2:
    build: .
    container_name: api2
    restart: always
    networks:
      - proxy
    environment:
      - SERVICE_NAME=API Service 2
      - SERVICE_PORT=5000
      - SERVICE_COLOR=green
    labels:
      - traefik.enable=true
      - traefik.http.routers.api2.rule=Host(`api2.localhost`)
      - traefik.http.routers.api2.entrypoints=web,websecure
      - traefik.http.routers.api2.tls=true
      - traefik.http.services.api2.loadbalancer.server.port=5000
      - traefik.http.middlewares.api2-compress.compress=true
      - traefik.http.routers.api2.middlewares=api2-compress,security-headers

  app:
    build: .
    container_name: app
    restart: always
    networks:
      - proxy
    environment:
      - SERVICE_NAME=Web Application
      - SERVICE_PORT=5000
      - SERVICE_COLOR=purple
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.localhost`)
      - traefik.http.routers.app.entrypoints=web,websecure
      - traefik.http.routers.app.tls=true
      - traefik.http.services.app.loadbalancer.server.port=5000
      - traefik.http.middlewares.app-compress.compress=true
      - traefik.http.routers.app.middlewares=app-compress,security-headers

networks:
  proxy:
    driver: bridge
