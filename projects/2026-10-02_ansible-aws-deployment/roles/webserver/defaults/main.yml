---
# Default variables for webserver role

# Nginx configuration
nginx_config:
  worker_processes: auto
  worker_connections: 1024
  keepalive_timeout: 65
  client_max_body_size: 100M

# Application configuration
app_repo: "https://github.com/username/webapp.git"
app_branch: "main"
app_port: 8000
app_workers: 4
app_wsgi: "app:app"

# Environment
app_env:
  DEBUG: "false"
  LOG_LEVEL: "INFO"

# Ports
web_port: 80
app_backend_port: 8000

# Services to enable
enable_services:
  - nginx
  - webapp
