---
# Role webserver - Installation de Nginx et de l'application

- name: Install Nginx
  yum:
    name: nginx
    state: present
  become: yes
  tags:
    - nginx
    - packages

- name: Create Nginx configuration from template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    backup: yes
  become: yes
  notify: restart nginx
  tags:
    - nginx
    - config

- name: Create Nginx site configuration
  template:
    src: site.conf.j2
    dest: /etc/nginx/conf.d/app.conf
    backup: yes
  become: yes
  notify: restart nginx
  tags:
    - nginx
    - config

- name: Enable Nginx service
  service:
    name: nginx
    state: started
    enabled: yes
  become: yes
  tags:
    - nginx

- name: Install Python dependencies
  yum:
    name:
      - python3
      - python3-pip
      - python3-devel
      - gcc
    state: present
  become: yes
  tags:
    - python
    - packages

- name: Create Python virtual environment
  file:
    path: "{{ app_home }}/venv"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  become: yes

- name: Create application systemd service
  template:
    src: webapp.service.j2
    dest: /etc/systemd/system/webapp.service
    backup: yes
  become: yes
  notify: reload systemd
  tags:
    - systemd

- name: Create app directory
  file:
    path: "{{ app_home }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: yes

- name: Create requirements.txt
  copy:
    content: |
      Flask==2.3.0
      Gunicorn==20.1.0
      python-dotenv==1.0.0
      requests==2.31.0
    dest: "{{ app_home }}/requirements.txt"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  become: yes

- name: Install Python packages
  pip:
    requirements: "{{ app_home }}/requirements.txt"
    virtualenv: "{{ app_home }}/venv"
    virtualenv_python: python3
  become: yes
  become_user: "{{ app_user }}"

- name: Create sample application
  copy:
    src: app.py
    dest: "{{ app_home }}/app.py"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  become: yes

- name: Add firewall rule for HTTP
  firewalld:
    service: http
    permanent: yes
    state: enabled
    immediate: yes
  become: yes
  tags:
    - firewall

- name: Add firewall rule for HTTPS
  firewalld:
    service: https
    permanent: yes
    state: enabled
    immediate: yes
  become: yes
  tags:
    - firewall

- name: Create health check endpoint
  copy:
    content: |
      server {
          listen 9000;
          location /health {
              return 200 "OK";
          }
      }
    dest: /etc/nginx/conf.d/health.conf
  become: yes
  notify: restart nginx
  tags:
    - health_check
