# Ansible Inventory - Hosts statiques

# Groupe webservers - Serveurs web (Nginx + App)
[webservers]
web1.example.com ansible_user=ec2-user ansible_host=10.0.1.10 environment=dev
web2.example.com ansible_user=ec2-user ansible_host=10.0.1.11 environment=prod

# Groupe cacheservers - Serveurs de cache Redis
[cacheservers]
cache1.example.com ansible_user=ec2-user ansible_host=10.0.2.10

# Groupe dbservers - Serveurs de base de données
[dbservers]
db1.example.com ansible_user=ec2-user ansible_host=10.0.3.10 db_role=primary

# Tous les serveurs - Variables globales
[all:vars]
# Chemin vers la clé SSH privée
ansible_ssh_private_key_file=~/.ssh/aws.pem

# Interpréteur Python sur les hosts
ansible_python_interpreter=/usr/bin/python3

# Version de l'application
app_version=1.0.0
app_user=appuser
app_group=appuser
app_home=/opt/webapp

# Configuration Nginx
nginx_port=80
nginx_worker_processes=auto
nginx_worker_connections=1024

# Configuration application
app_port=8000
app_workers=4
app_wsgi=app:app

# Variables de monitoring
monitoring_enabled=true
log_level=INFO
