---
# Variables pour le groupe webservers

# Packages à installer
packages_to_install:
  - nginx
  - python3
  - python3-pip
  - python3-venv
  - git
  - curl
  - wget

# Ports
web_port: 80
app_backend_port: 8000

# Configuration Nginx
nginx_config:
  worker_processes: auto
  worker_connections: 1024
  keepalive_timeout: 65
  client_max_body_size: 100M

# Configuration application
app_repo: "https://github.com/username/webapp.git"
app_branch: "main"
app_env:
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  DATABASE_URL: "postgresql://user:pass@db1.example.com/webapp"
  REDIS_URL: "redis://cache1.example.com:6379/0"

# Configuration Systemd
enable_services:
  - nginx
  - webapp

# Monitoring
metrics_enabled: true
log_rotation_days: 7
