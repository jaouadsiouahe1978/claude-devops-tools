[defaults]
# Fichier inventaire par défaut
inventory = inventory/hosts.ini

# Le dossier roles
roles_path = ./roles

# Désactiver les clés SSH hosts
host_key_checking = False

# Timeout par défaut
timeout = 30

# Mode gather facts au démarrage
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Variables d'environnement Ansible
[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
# Réutiliser les connexions SSH
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
