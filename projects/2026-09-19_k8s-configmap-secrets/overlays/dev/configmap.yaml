apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: config-demo
    environment: development
data:
  APP_NAME: "ConfigDemo-Dev"
  ENVIRONMENT: "development"
  APP_VERSION: "1.0.0-dev"
  LOG_LEVEL: "DEBUG"
  DEBUG: "true"
  PORT: "5000"
  DB_HOST: "postgres-dev.default.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "app_dev"
  DB_USER: "app_user"
  API_TIMEOUT: "60"
  API_RETRY_COUNT: "5"
  CACHE_TTL: "300"
  FEATURE_FLAGS: "debug=true,new_ui=false,beta_features=true"
