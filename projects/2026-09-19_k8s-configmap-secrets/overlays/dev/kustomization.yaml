apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

bases:
- ../../base

resources:
- namespace.yaml
- configmap.yaml
- secrets.yaml

replicas:
- name: config-demo
  count: 1

commonLabels:
  environment: development

commonAnnotations:
  environment.info: "Development environment for testing"
  owner: "DevOps Team"
