apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: config-demo
    environment: staging
data:
  APP_NAME: "ConfigDemo-Staging"
  ENVIRONMENT: "staging"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
  DEBUG: "false"
  PORT: "5000"
  DB_HOST: "postgres-staging.staging.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "app_staging"
  DB_USER: "app_user"
  API_TIMEOUT: "30"
  API_RETRY_COUNT: "3"
  CACHE_TTL: "600"
  FEATURE_FLAGS: "debug=false,new_ui=false,beta_features=false"
