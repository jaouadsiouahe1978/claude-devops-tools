apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

bases:
- ../../base

resources:
- namespace.yaml
- configmap.yaml
- secrets.yaml

replicas:
- name: config-demo
  count: 2

commonLabels:
  environment: staging

commonAnnotations:
  environment.info: "Staging environment for pre-production testing"
  owner: "DevOps Team"
