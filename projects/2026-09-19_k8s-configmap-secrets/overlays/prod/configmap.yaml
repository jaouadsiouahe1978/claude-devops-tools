apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: config-demo
    environment: production
data:
  APP_NAME: "ConfigDemo"
  ENVIRONMENT: "production"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "WARN"
  DEBUG: "false"
  PORT: "5000"
  DB_HOST: "postgres.production.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "app_prod"
  DB_USER: "app_user"
  API_TIMEOUT: "15"
  API_RETRY_COUNT: "2"
  CACHE_TTL: "3600"
  FEATURE_FLAGS: "debug=false,new_ui=true,beta_features=false"
  TLS_ENABLED: "true"
  TLS_VERIFY: "true"
