apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-demo
  labels:
    app: config-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-demo-reader
  labels:
    app: config-demo
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-demo-reader-binding
  labels:
    app: config-demo
subjects:
- kind: ServiceAccount
  name: config-demo
roleRef:
  kind: Role
  name: config-demo-reader
  apiGroup: rbac.authorization.k8s.io
