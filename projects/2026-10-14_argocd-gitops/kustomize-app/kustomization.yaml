apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kustomize-demo

commonLabels:
  app: kustomize-demo
  managed-by: argocd

resources:
  - deployment.yaml
  - service.yaml

images:
  - name: nginx
    newTag: "1.24-alpine"

replicas:
  - name: kustomize-demo
    count: 2

configMapGenerator:
  - name: app-config
    literals:
      - environment=production
      - log-level=info
