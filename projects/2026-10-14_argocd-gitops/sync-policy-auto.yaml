---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strict-autosync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jaouadsiouahe1978/claude-devops-tools
    targetRevision: main
    path: projects/2026-10-14_argocd-gitops/helm-app
  destination:
    server: https://kubernetes.default.svc
    namespace: strict-ns
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conservative-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jaouadsiouahe1978/claude-devops-tools
    targetRevision: main
    path: projects/2026-10-14_argocd-gitops/helm-app
  destination:
    server: https://kubernetes.default.svc
    namespace: conservative-ns
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: false
