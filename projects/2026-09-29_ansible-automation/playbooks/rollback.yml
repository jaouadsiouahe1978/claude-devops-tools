---
# Rollback.yml - Playbook pour revenir à la version précédente

- name: Rollback Application
  hosts: webservers
  become: yes
  serial: 1

  vars:
    previous_version: "{{ previous_version | default('1.0.0') }}"

  pre_tasks:
    - name: Annoncer le rollback
      debug:
        msg: "🔄 Rollback vers version {{ previous_version }} sur {{ inventory_hostname }}"

  tasks:
    - name: Arrêter l'application
      systemd:
        name: app
        state: stopped
      ignore_errors: yes

    - name: Revenir à la version précédente du code
      shell: |
        cd {{ app_home }}/repo
        git checkout v{{ previous_version }}
        git pull origin main
      become_user: "{{ app_user }}"

    - name: Installer dépendances (version précédente)
      shell: |
        cd {{ app_home }}/repo
        pip install -r requirements.txt
      ignore_errors: yes

    - name: Redémarrer l'application
      systemd:
        name: app
        state: started
      ignore_errors: yes

    - name: Vérifier la santé après rollback
      uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 3
      delay: 5
      until: health_check.status == 200

  post_tasks:
    - name: Envoyer alerte
      debug:
        msg: "⚠️  Rollback complété - application revenue à {{ previous_version }}"
