---
# Ansible Inventory - Définition des serveurs et groupes
# Usage: ansible-playbook playbooks/site.yml -i inventory/hosts.yml

all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_python_interpreter: /usr/bin/python3
    # Variables globales
    app_user: appuser
    app_group: appuser
    app_home: /opt/app
    env: production

  children:
    # Groupe des serveurs web (Nginx + Application)
    webservers:
      hosts:
        web1:
          ansible_host: 192.168.1.101
          ansible_port: 22
          server_name: web1.example.com
          app_port: 8080
        web2:
          ansible_host: 192.168.1.102
          ansible_port: 22
          server_name: web2.example.com
          app_port: 8080
      vars:
        nginx_user: www-data
        nginx_worker_processes: auto
        nginx_worker_connections: 1024

    # Groupe des serveurs base de données
    dbservers:
      hosts:
        db1:
          ansible_host: 192.168.1.103
          ansible_port: 22
          server_name: db1.example.com
          postgres_version: "14"
          postgres_port: 5432
      vars:
        postgres_user: postgres
        postgres_data_dir: /var/lib/postgresql
        postgres_backup_dir: /backups/postgresql

    # Groupe des serveurs de monitoring
    monitoring:
      hosts:
        mon1:
          ansible_host: 192.168.1.104
          ansible_port: 22
          server_name: mon1.example.com
          prometheus_port: 9090
          grafana_port: 3000
      vars:
        prometheus_scrape_interval: 15s
        prometheus_evaluation_interval: 15s

    # Groupes virtuels pour les patterns
    prod:
      children:
        - webservers
        - dbservers
        - monitoring

    # Serveurs gérant les backups
    backup_clients:
      children:
        - webservers
        - dbservers
