---
# Common - Tâches communes pour tous les serveurs

- name: Installer dépendances système
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - gnupg2
      - ca-certificates
      - apt-transport-https
      - software-properties-common
    state: present
    update_cache: yes

- name: Configurer timezone
  timezone:
    name: UTC

- name: Configurer NTP (chrony)
  block:
    - apt:
        name: chrony
        state: present
    - systemd:
        name: chrony
        state: started
        enabled: yes

- name: Créer utilisateur applicatif
  user:
    name: "{{ app_user }}"
    shell: /bin/bash
    home: "{{ app_home }}"
    createhome: yes
    groups: sudo
  ignore_errors: yes

- name: Configurer sudoers pour app_user
  lineinfile:
    path: /etc/sudoers.d/app
    line: "{{ app_user }} ALL=(ALL) NOPASSWD: ALL"
    create: yes
    validate: '/usr/sbin/visudo -cf %s'

- name: Mettre à jour le système
  apt:
    upgrade: dist
    update_cache: yes
    autoclean: yes
    autoremove: yes

- name: Configurer limites système
  template:
    src: limits.conf.j2
    dest: /etc/security/limits.d/99-app.conf
  notify: restart services

- name: Configurer sysctl
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: 'net.ipv4.tcp_max_syn_backlog', value: '4096' }
    - { key: 'net.core.somaxconn', value: '4096' }
    - { key: 'net.ipv4.ip_local_port_range', value: '1024 65000' }

- name: Activer module kernel (si nécessaire)
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  ignore_errors: yes
