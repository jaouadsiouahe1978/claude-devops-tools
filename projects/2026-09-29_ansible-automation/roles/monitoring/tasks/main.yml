---
# Role Monitoring - Installation Prometheus et exporters

- name: Créer utilisateur prometheus
  user:
    name: prometheus
    shell: /bin/false
    home: /etc/prometheus
    createhome: no

- name: Créer répertoires Prometheus
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Télécharger Prometheus
  shell: |
    cd /tmp
    VERSION="2.50.0"
    wget https://github.com/prometheus/prometheus/releases/download/v${VERSION}/prometheus-${VERSION}.linux-amd64.tar.gz
    tar xzf prometheus-${VERSION}.linux-amd64.tar.gz
  args:
    creates: /tmp/prometheus-2.50.0.linux-amd64

- name: Copier binaires Prometheus
  copy:
    src: "/tmp/prometheus-2.50.0.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/"
    owner: root
    group: root
    mode: '0755'
    remote_src: yes
  loop:
    - prometheus
    - promtool
  ignore_errors: yes

- name: Créer fichier de configuration Prometheus
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: '0644'
  notify: restart prometheus

- name: Créer règles d'alertes
  copy:
    content: |
      groups:
      - name: system
        interval: 30s
        rules:
        - alert: HighCPUUsage
          expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"

        - alert: HighMemoryUsage
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
    dest: /etc/prometheus/rules.yml
    owner: prometheus
    group: prometheus
  notify: restart prometheus

- name: Créer systemd unit pour Prometheus
  copy:
    content: |
      [Unit]
      Description=Prometheus
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus/

      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/prometheus.service
  notify: restart prometheus

- name: Installer node_exporter (système)
  shell: |
    VERSION="1.7.0"
    cd /tmp
    wget https://github.com/prometheus/node_exporter/releases/download/v${VERSION}/node_exporter-${VERSION}.linux-amd64.tar.gz
    tar xzf node_exporter-${VERSION}.linux-amd64.tar.gz
    cp node_exporter-${VERSION}.linux-amd64/node_exporter /usr/local/bin/
  args:
    creates: /usr/local/bin/node_exporter
  ignore_errors: yes

- name: Créer systemd unit pour node_exporter
  copy:
    content: |
      [Unit]
      Description=Node Exporter
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/node_exporter
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/node_exporter.service
  ignore_errors: yes
  notify: restart node_exporter

- name: Démarrer Prometheus
  systemd:
    name: prometheus
    state: started
    enabled: yes
    daemon_reload: yes
  ignore_errors: yes

- name: Démarrer node_exporter
  systemd:
    name: node_exporter
    state: started
    enabled: yes
    daemon_reload: yes
  ignore_errors: yes

- name: Vérifier Prometheus est accessible
  uri:
    url: "http://localhost:{{ prometheus_port }}/-/healthy"
    method: GET
  register: prometheus_health
  ignore_errors: yes

- name: Afficher statut Prometheus
  debug:
    msg: "Prometheus health: {{ prometheus_health.status | default('unknown') }}"
