---
# Handlers pour le rôle database

- name: restart postgresql
  systemd:
    name: postgresql
    state: restarted
    daemon_reload: yes
  listen: "restart postgresql"

- name: reload postgresql
  shell: sudo -u postgres /usr/lib/postgresql/{{ postgres_version }}/bin/pg_ctl reload -D /var/lib/postgresql/{{ postgres_version }}/main
  listen: "reload postgresql"
