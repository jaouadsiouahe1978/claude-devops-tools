version: '3.8'

services:
  vault:
    image: vault:latest
    container_name: vault-server
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroot"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    volumes:
      - vault-data:/vault/data
      - ./vault-config.hcl:/vault/config/config.hcl
      - ./init.sh:/init.sh
    command: server -config=/vault/config/config.hcl
    cap_add:
      - IPC_LOCK
    networks:
      - vault-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: vault-postgres
    environment:
      POSTGRES_DB: vault_demo
      POSTGRES_USER: vaultadmin
      POSTGRES_PASSWORD: vaultpass123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database-setup.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - vault-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vault-data:
  postgres-data:

networks:
  vault-network:
    driver: bridge
