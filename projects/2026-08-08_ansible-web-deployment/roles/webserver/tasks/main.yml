---
# Webserver Role: Installation de Node.js et Nginx

- name: "Install Node.js from NodeSource repository"
  block:
    - name: "Add NodeSource GPG key"
      apt_key:
        url: "https://deb.nodesource.com/gpgkey/nodesource.gpg.key"
        state: present

    - name: "Add NodeSource repository"
      apt_repository:
        repo: "deb https://deb.nodesource.com/node_{{ node_version }}.x {{ ansible_distribution_release }} main"
        state: present

    - name: "Install Node.js"
      apt:
        name: nodejs
        state: present
  when: ansible_os_family == "Debian"

- name: "Verify Node.js installation"
  command: node --version
  register: node_version_output
  changed_when: false

- name: "Display Node.js version"
  debug:
    msg: "✓ Node.js installed: {{ node_version_output.stdout }}"

- name: "Install Nginx"
  apt:
    name: nginx
    state: present
  when: ansible_os_family == "Debian"

- name: "Enable Nginx service"
  systemd:
    name: nginx
    enabled: yes
    state: started

- name: "Configure Nginx as reverse proxy"
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    backup: yes
  notify: Restart Nginx

- name: "Create log directory for application"
  file:
    path: "{{ app_home }}/logs"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
    state: directory

- name: "Display webserver setup complete"
  debug:
    msg: |
      ✓ Nginx configured and running
      ✓ Node.js ready for deployment
