# Ansible Inventory Configuration
# Ce fichier définit les serveurs cibles et les variables

[webservers]
# Pour tester localement
web1 ansible_host=localhost ansible_connection=local

# Pour serveurs distants (décommenter et adapter)
# web1 ansible_host=192.168.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
# web2 ansible_host=192.168.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[webservers:vars]
# Variables partagées pour tous les webservers
app_user=webapp
app_group=webapp
app_home=/home/webapp
app_repo=https://github.com/jaouadsiouahe1978/simple-node-app.git
app_version=main
node_version=18
nginx_port=80

[all:vars]
# Variables globales
ansible_python_interpreter=/usr/bin/python3
