[webservers]
# Remplacez par l'adresse IP de votre serveur
server1 ansible_host=192.168.1.100 ansible_user=ubuntu ansible_password=your_password
# server2 ansible_host=192.168.1.101 ansible_user=ubuntu

# Pour utiliser SSH key au lieu du mot de passe:
# server1 ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
# Variables globales pour tous les serveurs
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
