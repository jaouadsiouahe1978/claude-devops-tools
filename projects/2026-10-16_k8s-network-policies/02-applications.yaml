---
# Frontend Deployment (Nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend
  labels:
    app: frontend
    tier: presentation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: config
        configMap:
          name: frontend-config

---
# Frontend ConfigMap (Nginx config pointing to API)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
            return 200 "Frontend Service - Hello from Nginx\n";
        }

        location /api {
            proxy_pass http://api-service.api:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: frontend
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
    name: http

---
# API Deployment (Python Flask)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: api
  labels:
    app: api
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: application
    spec:
      containers:
      - name: flask-api
        image: python:3.11-slim
        ports:
        - containerPort: 5000
          name: http
        command:
        - sh
        - -c
        - |
          pip install flask -q && python -c "
          from flask import Flask, jsonify
          app = Flask(__name__)

          @app.route('/status')
          def status():
              return jsonify({'status': 'API Service Running', 'version': '1.0'})

          @app.route('/health')
          def health():
              return jsonify({'health': 'ok'})

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000)
          "
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: api
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http

---
# Database Pod (MySQL-like)
apiVersion: v1
kind: Pod
metadata:
  name: database
  namespace: database
  labels:
    app: database
    tier: data
spec:
  containers:
  - name: mysql
    image: mysql:8.0
    ports:
    - containerPort: 3306
      name: mysql
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: "rootpassword"
    - name: MYSQL_DATABASE
      value: "appdb"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

---
# Database Service
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: database
  labels:
    app: database
spec:
  type: ClusterIP
  selector:
    app: database
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql
