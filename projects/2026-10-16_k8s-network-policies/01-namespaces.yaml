---
# Frontend namespace (public facing)
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    name: frontend
    tier: presentation

---
# API namespace (internal services)
apiVersion: v1
kind: Namespace
metadata:
  name: api
  labels:
    name: api
    tier: application

---
# Database namespace (restricted access)
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    name: database
    tier: data
