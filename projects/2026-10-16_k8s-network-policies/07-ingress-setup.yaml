---
# Simple Ingress setup for testing external traffic
# Using NodePort for simplicity in local environments
apiVersion: v1
kind: Service
metadata:
  name: frontend-ingress
  namespace: frontend
  labels:
    app: frontend-ingress
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000
    protocol: TCP
    name: http

---
# Alternative: Deploy a simple ingress controller using DaemonSet
# This is a basic implementation, production would use nginx-ingress or similar
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: simple-ingress-controller
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: simple-ingress
  template:
    metadata:
      labels:
        app: simple-ingress
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: haproxy
        image: haproxy:2.8-alpine
        ports:
        - containerPort: 80
          hostPort: 80
        - containerPort: 443
          hostPort: 443
        volumeMounts:
        - name: config
          mountPath: /usr/local/etc/haproxy
      volumes:
      - name: config
        configMap:
          name: ingress-haproxy-config

---
# HAProxy configuration for the ingress controller
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-haproxy-config
  namespace: kube-system
data:
  haproxy.cfg: |
    global
        maxconn 4096

    defaults
        mode http
        timeout connect 5000ms
        timeout client 50000ms
        timeout server 50000ms

    frontend http-in
        bind *:80
        default_backend frontend-backend

    backend frontend-backend
        balance roundrobin
        # Service endpoints will be added dynamically
        server frontend frontend-service.frontend:80 check
